server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve `backend` on each request so nginx does not keep a
    # stale container IP after `docker compose restart backend` (otherwise persistent 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicit types so ES modules are always served as JavaScript MIME.
    # Browsers refuse to import modules if the Content-Type is not a JS MIME.
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        application/octet-stream              bin;
    }
    default_type application/octet-stream;

    # API endpoints with extended timeouts for slow model generations
    location /api/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE FIX: disable BOTH request AND response buffering.
        # proxy_request_buffering off = don't buffer the POST body (was already set).
        # proxy_buffering off         = don't buffer the SSE response — send each
        #                               token chunk to the browser immediately.
        # Without proxy_buffering off nginx holds the entire stream in memory and
        # only flushes it when the connection closes, causing the "dumps all at
        # once after a long wait" problem.
        proxy_request_buffering off;
        proxy_buffering off;

        # Extended timeouts for slow LLM generation
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Ollama-Base-Url';
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /gm/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_request_buffering off;
        proxy_buffering off;

        # Extended timeouts for slow LLM generation
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # CORS preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Ollama-Base-Url';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OVERVIEW' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # Voice service routes (TTS + STT websocket) for DEV at :3002.
    # Without this, /voice/* falls through to index.html and STT never reaches backend.
    location /voice/stt {
        set $ai_gm_voice http://voice-service:8300;
        proxy_pass $ai_gm_voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /voice/ {
        set $ai_gm_voice http://voice-service:8300;
        proxy_pass $ai_gm_voice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── NEW admin panel (primary) ─────────────────────────────────────
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /usr/share/nginx/html/admin_panel_v2/;
        try_files $uri $uri/ /admin_panel_v2/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # /admin2/ kept as alias so existing bookmarks still work
    location = /admin2 { return 301 /admin2/; }
    location /admin2/ {
        alias /usr/share/nginx/html/admin_panel_v2/;
        try_files $uri $uri/ /admin_panel_v2/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /admin_panel_v2/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── OLD admin panel (archived, read-only) ─────────────────────────
    location = /panel { return 301 /panel/; }
    location /panel/ {
        alias /usr/share/nginx/html/admin_panel/;
        try_files $uri $uri/ /admin_panel/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /admin_panel/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── NEW main frontend (primary, served at /) ──────────────────────
    # /front/ kept as alias so existing bookmarks still work
    location = /front { return 301 /front/; }
    location /front/ {
        alias /usr/share/nginx/html/front/;
        try_files $uri $uri/ /front/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── OLD frontend (archived at /old/, read-only) ────────────────────
    # Static assets for /old/ must come BEFORE the general asset regex so
    # that /old/js/app.js → /usr/share/nginx/html/js/app.js resolves correctly.
    location ~* ^/old/(.+\.(?:css|gif|ico|jpe?g|js|json|map|mjs|png|svg|wasm|webp|woff2?))$ {
        alias /usr/share/nginx/html/$1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /old { return 301 /old/; }
    location /old/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ @old_fallback;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location @old_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── Static assets (general) ────────────────────────────────────────
    # Must never fall back to SPA shell — missing .wasm → index.html breaks WebAssembly.
    # front/ is checked first so the new frontend's assets (e.g. /js/app.js, /css/styles.css)
    # shadow any identically-named legacy files still present under the root html dir.
    # /old/ assets are handled by their own location above and are not affected.
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|mjs|png|svg|wasm|webp|woff2?)$ {
        try_files /front$uri $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── NEW main frontend catch-all ────────────────────────────────────
    location / {
        root /usr/share/nginx/html/front;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
