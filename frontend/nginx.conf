server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve `backend` on each request so nginx does not keep a
    # stale container IP after `docker compose restart backend` (otherwise persistent 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicit types so ES modules are always served as JavaScript MIME.
    # Browsers refuse to import modules if the Content-Type is not a JS MIME.
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        application/octet-stream              bin;
    }
    default_type application/octet-stream;

    # API endpoints with extended timeouts for slow model generations
    location /api/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Ollama-Base-Url';
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /gm/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Ollama-Base-Url';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OVERVIEW' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # Voice service routes
    location /voice/stt {
        set $ai_gm_voice http://voice-service:8300;
        proxy_pass $ai_gm_voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /voice/ {
        set $ai_gm_voice http://voice-service:8300;
        proxy_pass $ai_gm_voice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Admin panels (served from their own directories) ──────────────────────

    location = /admin  { return 301 /admin/; }
    location = /panel  { return 301 /panel/; }
    location = /admin2 { return 301 /admin2/; }
    # FADM-P17 (#453) — admin3 wycofany; redirect do aktywnego panelu
    location = /admin3         { return 301 /admin/; }
    location = /admin3/        { return 301 /admin/; }
    location /admin_panel_v3/  { return 301 /admin/; }

    # FADM-P17 (#453) — /admin/ to modularna skorupa (frontend/admin/). admin3 wycofany.
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /panel/ {
        alias /usr/share/nginx/html/admin_panel/;
        try_files $uri $uri/ /admin_panel/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /admin_panel/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Admin panel v2 — explicit route needed because location / now roots to front/
    location = /admin2/ {
        root /usr/share/nginx/html;
        try_files /admin_panel_v2/index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /admin_panel_v2/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin_panel_v2/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Try the file in root (/usr/share/nginx/html) first — covers admin_panel_v2
    # assets at their real paths. Fall back to front/ for player-app assets
    # (JS, CSS, images) whose URLs are now at the root (e.g. /js/app.js).
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|mjs|png|svg|wasm|webp|woff2?)$ {
        try_files $uri /front$uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Player app at root ────────────────────────────────────────────────────
    # Serve the front/ SPA at / without a redirect. The URL stays clean.
    # root is overridden to front/ so $uri resolves inside that directory.
    location / {
        root /usr/share/nginx/html/front;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
