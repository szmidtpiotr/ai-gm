server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Za NPM (TLS na proxy) nginx nie zna schematu — absolutne redirecty
    # emitowałyby http://. Relatywne Location działa w każdej przeglądarce.
    absolute_redirect off;

    # Docker embedded DNS — re-resolve `backend` on each request so nginx does not keep a
    # stale container IP after `docker compose restart backend` (otherwise persistent 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicit types so ES modules are always served as JavaScript MIME.
    # Browsers refuse to import modules if the Content-Type is not a JS MIME.
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        application/manifest+json             webmanifest;
        application/octet-stream              bin;
    }
    default_type application/octet-stream;

    # #1493 — /api/debug/* to narzędzia deweloperskie BEZ logowania (montowane tylko
    # przy AI_TEST_MODE=1, czyli na DEV). Publiczny DEV wystawiał je całemu internetowi:
    # dawało to odczyt cudzych postaci/kampanii i podmianę odpowiedzi GM dla wszystkich
    # graczy (POST /api/debug/stub_llm). Wpuszczamy wyłącznie ruch z sieci kontenerów —
    # test-agent (Playwright) jest w niej, a reverse proxy (192.168.1.4) już nie.
    # Skrypty na hoście uderzają prosto w port backendu i tego bloku nie dotykają.
    location /api/debug/ {
        allow 172.16.0.0/12;   # sieci docker (test-agent, mcp-server)
        allow 127.0.0.1;
        deny all;

        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API endpoints with extended timeouts for slow model generations
    location /api/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Ollama-Base-Url';
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /gm/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Ollama-Base-Url';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OVERVIEW' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # Voice service routes — #748: forward to the BACKEND voice proxy (not the
    # bundled voice-service container, which isn't running on DEV). The backend
    # routes to whichever voice_hosts row is active (np. .16 GPU box).
    location /voice/stt {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /voice/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Admin panels (served from their own directories) ──────────────────────

    location = /admin  { return 301 /admin/; }
    location = /admin2 { return 301 /admin2/; }
    # FADM-P17 (#453) — admin3 wycofany; redirect do aktywnego panelu
    location = /admin3         { return 301 /admin/; }
    location = /admin3/        { return 301 /admin/; }
    location /admin_panel_v3/  { return 301 /admin/; }

    # FADM-P17 (#453) — /admin/ to modularna skorupa (frontend/admin/). admin3 wycofany.
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Wizytówka projektu (Faza W) — publiczny landing. Teraz GŁÓWNA strona (root `/`).
    # Zachowany też alias /showcase/ (back-compat dla starych linków / canonical).
    location = /showcase { return 301 /showcase/; }
    location /showcase/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /showcase/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Nowy frontend gracza (front-v2 / ŻAR) — serwuje zbudowane dist/ pod /graj/ ──
    # ^~ ma priorytet nad regexem assetów niżej, więc /graj/assets/*.js trafia tutaj,
    # nie do reguły \.(js|css)$. SPA fallback → front-v2/dist/index.html.
    location ^~ /graj/ {
        alias /usr/share/nginx/html/front-v2/dist/;
        try_files $uri $uri/ /graj/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /graj { return 301 /graj/; }
    # Back-compat: stary adres ŻAR /v2/ → /graj/ (bookmarki, zainstalowane PWA).
    location ^~ /v2/ { return 301 /graj/; }
    location = /v2   { return 301 /graj/; }

    # Back-compat: root-owe trasy auth starego frontu — linki w already-wysłanych
    # mailach (invite/weryfikacja/reset) wskazują root; root to teraz wizytówka,
    # więc bez redirectu lądowałyby na landingu. $is_args$args zachowuje token.
    location = /register       { return 301 /graj/rejestracja$is_args$args; }
    location = /verify-email   { return 301 /graj/weryfikacja-email$is_args$args; }
    location = /reset-password { return 301 /graj/reset-hasla$is_args$args; }

    # Stary frontend gracza (front/, /old/) usunięty 2026-07-18 — ŻAR (/graj/)
    # jest jedynym UI gracza. Bookmarki na /old/ kierujemy do ŻAR.
    location ^~ /old/ { return 301 /graj/; }
    location = /old   { return 301 /graj/; }

    # Księga Zasad — żyje w frontend/rules/ (wyniesiona ze skasowanego front/).
    location ^~ /rules/ {
        alias /usr/share/nginx/html/rules/;
        try_files $uri $uri/ /rules/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Admin panel v2 — explicit route needed because location / now roots to front/
    location = /admin2/ {
        root /usr/share/nginx/html;
        try_files /admin_panel_v2/index.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /admin_panel_v2/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin_panel_v2/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Root to teraz showcase, więc jego względne ścieżki (/assets/...) muszą
    # rozwiązać się w /showcase/. Kolejność: dokładny $uri (admin_panel_v2 na
    # realnych ścieżkach) → showcase. /graj/ /rules/ mają ^~ i nie trafiają tutaj.
    location ~* \.(?:css|gif|ico|jpe?g|js|json|map|mjs|png|svg|wasm|webp|woff2?)$ {
        try_files $uri /showcase$uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Wizytówka w rootcie ───────────────────────────────────────────────────
    # Główna strona = showcase landing. root wskazuje na showcase/, więc
    # /swiat.html, /changelog.html, /assets/... rozwiązują się wewnątrz katalogu.
    location / {
        root /usr/share/nginx/html/showcase;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
