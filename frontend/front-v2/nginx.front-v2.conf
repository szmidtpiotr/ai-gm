# Standalone nginx dla obrazu front-v2 (multi-stage Dockerfile).
# Na DEV front-v2 jest serwowany przez WSPÓLNY nginx (frontend/nginx.conf, location ^~ /v2/).
# Ten plik = ścieżka produkcyjna / uruchomienie samodzielne.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        image/svg+xml                         svg svgz;
        font/woff2                            woff2;
        font/woff                             woff;
        application/manifest+json             webmanifest;
    }
    default_type application/octet-stream;

    # API → backend (identycznie jak stary front).
    location /api/ {
        set $ai_gm_backend http://backend:8000;
        proxy_pass $ai_gm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA front-v2 pod /v2/.
    location ^~ /v2/ {
        alias /usr/share/nginx/html/v2/;
        try_files $uri $uri/ /v2/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = / { return 301 /v2/; }
}
