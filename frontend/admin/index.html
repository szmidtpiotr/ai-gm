<!DOCTYPE html>
<html lang="pl" data-admin-shell="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-GM — Admin (modular)</title>
  <!-- Wygląd dziedziczony z admin3 (light theme, komponenty). Link PRZED inline <style>,
       żeby drobne reguły skorupy (placeholder/banner) mogły nadpisać kolizje. -->
  <link rel="stylesheet" href="./shared/components.css?v=1">
  <style>
    /* Skorupa-specyficzne — reszta z components.css (.shell/.sidebar/.topbar/.main/.nav-item). */
    .sidebar-logo-name small { display:block; color:var(--t3); font-weight:400; font-size:.62rem; letter-spacing:0; }
    .adm-placeholder { max-width:560px; margin:40px auto; background:var(--canvas); border:1px solid var(--border);
                       border-radius:var(--r-lg,10px); padding:26px; text-align:center; box-shadow:var(--shadow-sm); }
    .adm-placeholder h2 { color:var(--t1); margin:0 0 8px; font-size:1.05rem; }
    .adm-placeholder p { color:var(--t2); font-size:.86rem; margin:6px 0; }
    .adm-placeholder a { color:var(--blue); text-decoration:none; font-weight:600; }
    .adm-foot { color:var(--t3); font-size:.66rem; padding:10px; text-align:center; }
    .adm-banner { background:var(--amber-light); color:var(--amber); border:1px solid var(--amber-border); border-radius:8px;
                  padding:8px 12px; margin:0 0 14px; font-size:.8rem; }
    .adm-banner a { color:var(--amber); font-weight:700; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">GM</div>
        <div class="sidebar-logo-name">AI-GM Admin <small>modular · strangler-fig</small></div>
        <div class="sidebar-logo-env">DEV</div>
      </div>
      <nav class="sidebar-nav" id="admin-nav">
        <!-- nav items injected by router; data-section keys must stay stable -->
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar">A</div>
        <div class="user-info"><div class="user-name">Admin</div><div class="user-role">modular shell</div></div>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-title" id="admin-title">Panel</div>
    </header>

    <main class="main" id="panel">
      <div class="section active"><div class="adm-placeholder">Ładowanie…</div></div>
    </main>
  </div>

  <div class="adm-foot">FADM modular shell — sekcje nieportowane otwórz w <a href="/admin3/">/admin3/</a></div>

  <script type="module">
    import { apiFetch } from './shared/api.js';
    import { showToast } from './shared/toast.js';

    // 14 sekcji — klucze MUSZĄ pokrywać data-section z admin3 (port 1:1).
    const SECTIONS = [
      { key: 'overview',   label: 'Przegląd',   ico: '▦' },
      { key: 'players',    label: 'Gracze',     ico: '◉' },
      { key: 'campaigns',  label: 'Kampanie',   ico: '⛺' },
      { key: 'content',    label: 'Przedmioty', ico: '⚔' },
      { key: 'world',      label: 'Świat',      ico: '⊕' },
      { key: 'map',        label: 'Mapa',       ico: '🗺' },
      { key: 'mechanics',  label: 'Mechanika',  ico: '⚙' },
      { key: 'dungeons',   label: 'Lochy',      ico: '⛓' },
      { key: 'forge',      label: 'Kuźnia',     ico: '⚒' },
      { key: 'invites',    label: 'Zaproszenia',ico: '✉' },
      { key: 'bugreports', label: 'Zgłoszenia', ico: '🐞' },
      { key: 'push',       label: 'Push',       ico: '🔔' },
      { key: 'tools',      label: 'Narzędzia',  ico: '🛠' },
      { key: 'system',     label: 'System',     ico: '⎔' },
    ];
    const KEYS = SECTIONS.map(s => s.key);
    const LABELS = Object.fromEntries(SECTIONS.map(s => [s.key, s.label]));
    const LAST_KEY = 'aigm_admin_last_section';

    const nav = document.getElementById('admin-nav');
    SECTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'nav-item';
      b.dataset.section = s.key;
      b.innerHTML = `<span class="nav-item-icon">${s.ico}</span><span>${s.label}</span>`;
      b.addEventListener('click', () => { location.hash = '#' + s.key; });
      nav.appendChild(b);
    });

    function setActive(key) {
      nav.querySelectorAll('.nav-item').forEach(b =>
        b.classList.toggle('active', b.dataset.section === key));
      const title = document.getElementById('admin-title');
      if (title) title.textContent = LABELS[key] || 'Panel';
    }

    // Sekcje już sportowane do modularnego admin/ (rośnie z każdym FADM-Px).
    // Reszta ma swój dom w admin3 → klik takiej sekcji bounce'uje do /admin3/#key.
    // Jedno źródło prawdy: każda sekcja działa w dokładnie jednym miejscu (symetrycznie do
    // redirectu admin3 → /admin/ dla sekcji już sportowanych).
    const PORTED = new Set(['overview']);

    function placeholder(key) {
      return `<div class="section active"><div class="adm-placeholder">
        <h2>Sekcja „${LABELS[key] || key}"</h2>
        <p>Nie udało się załadować modułu sekcji.</p>
        <p><a href="/admin3/#${key}">Otwórz w /admin3/#${key} →</a></p>
      </div></div>`;
    }

    async function route() {
      let key = (location.hash || '').replace(/^#/, '');
      if (!KEYS.includes(key)) key = localStorage.getItem(LAST_KEY) || 'overview';
      if (!KEYS.includes(key)) key = 'overview';
      // Sekcja nieportowana → jej dom to admin3. Bounce zamiast martwego placeholdera.
      if (!PORTED.has(key)) { window.location.replace('/admin3/#' + key); return; }
      localStorage.setItem(LAST_KEY, key);
      setActive(key);
      const panel = document.getElementById('panel');
      panel.innerHTML = '<div class="section active"><div class="adm-placeholder">Ładowanie…</div></div>';
      try {
        // Sekcja portowana → sections/<key>.js eksportuje init(panel).
        const mod = await import(`./sections/${key}.js`);
        if (mod && typeof mod.init === 'function') {
          await mod.init(panel);
          return;
        }
        panel.innerHTML = placeholder(key);
      } catch (e) {
        // Ported, ale błąd importu → widoczny placeholder (nie cichy redirect, by nie maskować buga).
        panel.innerHTML = placeholder(key);
      }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('admin-unauthorized', () => {
      const panel = document.getElementById('panel');
      panel.insertAdjacentHTML('afterbegin',
        '<div class="adm-banner">Sesja admina wygasła — zaloguj się w <a href="/admin3/">/admin3/</a> (token współdzielony).</div>');
    });

    // expose shared do debug (sekcje importują własne moduły, to tylko wygoda)
    window.__adminShell = { apiFetch, showToast, SECTIONS };
    route();
  </script>
</body>
</html>
