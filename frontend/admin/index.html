<!DOCTYPE html>
<html lang="pl" data-admin-shell="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-GM — Admin (modular)</title>
  <!-- Wygląd dziedziczony z admin3 (light theme, komponenty). Link PRZED inline <style>,
       żeby drobne reguły skorupy (placeholder/banner) mogły nadpisać kolizje. -->
  <link rel="stylesheet" href="./shared/components.css?v=6">
  <style>
    /* Skorupa-specyficzne — reszta z components.css (.shell/.sidebar/.topbar/.main/.nav-item). */
    .sidebar-logo-name small { display:block; color:var(--t3); font-weight:400; font-size:.62rem; letter-spacing:0; }
    .adm-placeholder { max-width:560px; margin:40px auto; background:var(--canvas); border:1px solid var(--border);
                       border-radius:var(--r-lg,10px); padding:26px; text-align:center; box-shadow:var(--shadow-sm); }
    .adm-placeholder h2 { color:var(--t1); margin:0 0 8px; font-size:1.05rem; }
    .adm-placeholder p { color:var(--t2); font-size:.86rem; margin:6px 0; }
    .adm-placeholder a { color:var(--blue); text-decoration:none; font-weight:600; }
    .adm-foot { color:var(--t3); font-size:.66rem; padding:10px; text-align:center; }
    .adm-banner { background:var(--amber-light); color:var(--amber); border:1px solid var(--amber-border); border-radius:8px;
                  padding:8px 12px; margin:0 0 14px; font-size:.8rem; }
    .adm-banner a { color:var(--amber); font-weight:700; }
    /* ── Login overlay (FADM-P13) ── */
    .login-overlay { display:none; position:fixed; inset:0; background:var(--page); z-index:300;
                     align-items:center; justify-content:center; }
    .login-overlay.open { display:flex; }
    .login-box { background:var(--canvas); border:1px solid var(--border); border-radius:var(--r-xl,12px);
                 box-shadow:var(--shadow-md); padding:32px; width:100%; max-width:340px; }
    .login-head { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
    .login-title { font-size:.95rem; font-weight:700; color:var(--t1); }
    .login-sub { font-size:.73rem; color:var(--t3); }
    .login-err { font-size:.78rem; color:var(--red); background:var(--red-light); border:1px solid var(--red-border);
                 border-radius:var(--r,6px); padding:8px 12px; margin-bottom:14px; display:none; }
    .login-err.show { display:block; }
    .sidebar-footer .btn-logout { background:none; border:none; cursor:pointer; color:var(--t3);
                                  font-size:.72rem; padding:2px 4px; border-radius:4px; margin-top:2px; }
    .sidebar-footer .btn-logout:hover { color:var(--red); background:var(--red-light); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">GM</div>
        <div class="sidebar-logo-name">AI-GM Admin <small>modular · strangler-fig</small></div>
        <div class="sidebar-logo-env" id="sidebar-logo-env">DEV</div>
        <script>
          // Environment badge derived from hostname — never hardcode (was showing
          // "DEV" on PROD, misleading admins into destructive edits on production).
          (function () {
            var h = location.hostname || '';
            var isDev = h.indexOf('-dev') !== -1 || h === 'localhost' || h === '127.0.0.1';
            var el = document.getElementById('sidebar-logo-env');
            if (!el) return;
            if (isDev) {
              el.textContent = 'DEV';
            } else {
              el.textContent = 'PROD';
              el.style.background = '#dc2626';
              el.style.color = '#fff';
            }
          })();
        </script>
      </div>
      <nav class="sidebar-nav" id="admin-nav">
        <!-- nav items injected by router; data-section keys must stay stable -->
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-role">modular shell</div>
          <button class="btn-logout" id="btn-logout" onclick="doLogout()">Wyloguj</button>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <button class="hamburger" id="hamburger-btn" aria-label="Otwórz nawigację">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title" id="admin-title">Panel</div>
    </header>

    <main class="main" id="panel">
      <div class="section active"><div class="adm-placeholder">Ładowanie…</div></div>
    </main>
  </div>

  <!-- Mobile navigation drawer (#831) — hamburger → szuflada z pełną listą sekcji -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <nav class="mobile-drawer" id="mobile-drawer" aria-label="Nawigacja mobilna">
    <div style="padding:14px 12px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div class="sidebar-logo-mark">GM</div>
      <div style="flex:1;font-size:.82rem;font-weight:600;color:var(--t1)">AI-GM Admin</div>
      <button id="drawer-close-btn" style="background:none;border:none;cursor:pointer;color:var(--t3);font-size:1.1rem;padding:4px 8px;line-height:1;border-radius:4px" aria-label="Zamknij">✕</button>
    </div>
    <div id="mobile-drawer-nav" style="flex:1;overflow-y:auto;padding:6px 0"></div>
  </nav>

  <!-- Login overlay (FADM-P13) — widoczny gdy brak tokenu lub 401 -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <div class="login-head">
        <div class="sidebar-logo-mark">GM</div>
        <div>
          <div class="login-title">AI-GM Admin</div>
          <div class="login-sub">Panel administratora (modular)</div>
        </div>
      </div>
      <div class="login-err" id="login-err"></div>
      <div class="form-field" style="margin-bottom:12px">
        <label class="form-label">Nazwa użytkownika</label>
        <input class="form-input" id="login-user" type="text" placeholder="demo" autocomplete="username">
      </div>
      <div class="form-field" style="margin-bottom:20px">
        <label class="form-label">Hasło</label>
        <input class="form-input" id="login-pass" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="login-submit">Zaloguj się</button>
    </div>
  </div>

  <div class="adm-foot">FADM modular shell — wszystkie sekcje sportowane (admin3 wycofany)</div>

  <script type="module">
    import { apiFetch } from './shared/api.js';
    import { showToast } from './shared/toast.js';
    import { initSortableTable, enhanceTable } from './shared/table.js?v=8';

    // 18 sekcji — klucze MUSZĄ pokrywać data-section z admin3 (port 1:1).
    const SECTIONS = [
      { key: 'overview',   label: 'Przegląd',   ico: '▦' },
      { key: 'players',    label: 'Gracze',     ico: '◉' },
      { key: 'campaigns',  label: 'Kampanie',   ico: '⛺' },
      { key: 'heroes',     label: 'Bohaterowie',ico: '🧍' },
      { key: 'content',    label: 'Przedmioty', ico: '⚔' },
      { key: 'world',      label: 'Świat',      ico: '⊕' },
      { key: 'map',        label: 'Mapa',       ico: '🗺' },
      { key: 'mechanics',  label: 'Mechanika',  ico: '⚙' },
      { key: 'game-mechanics', label: 'Księga Zasad', ico: '📖' },
      { key: 'dungeons',   label: 'Lochy',      ico: '⛓' },
      { key: 'forge',      label: 'Kuźnia',     ico: '⚒' },
      { key: 'invites',    label: 'Zaproszenia',ico: '✉' },
      { key: 'bugreports', label: 'Zgłoszenia', ico: '🐞' },
      { key: 'push',       label: 'Push',       ico: '🔔' },
      { key: 'tools',      label: 'Narzędzia',  ico: '🛠' },
      { key: 'scenario',   label: 'Scenariusze',ico: '🎬' },
      { key: 'system',     label: 'System',     ico: '⎔' },
      { key: 'analytics', label: 'Statystyki',  ico: '📊' },
      { key: 'showcase',  label: 'Wizytówka',   ico: '🪟' },
      { key: 'manual',    label: 'Instrukcja',  ico: '🧭' },
    ];
    const KEYS = SECTIONS.map(s => s.key);
    const LABELS = Object.fromEntries(SECTIONS.map(s => [s.key, s.label]));
    const LAST_KEY = 'aigm_admin_last_section';

    const nav = document.getElementById('admin-nav');
    SECTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'nav-item';
      b.dataset.section = s.key;
      b.innerHTML = `<span class="nav-item-icon">${s.ico}</span><span>${s.label}${s.key === 'world' ? '<span class="nav-badge" id="world-nav-badge" style="display:none">0</span>' : ''}${s.key === 'content' ? '<span class="nav-badge" id="content-nav-badge" style="display:none" title="Duplikaty w treści (#1399)">0</span>' : ''}</span>`;
      b.addEventListener('click', () => { location.hash = '#' + s.key; });
      nav.appendChild(b);
    });

    // ── Mobile drawer (#831) ─────────────────────────────────────────────────
    const drawerNav = document.getElementById('mobile-drawer-nav');
    if (drawerNav) {
      SECTIONS.forEach(s => {
        const b = document.createElement('button');
        b.className = 'nav-item';
        b.dataset.section = s.key;
        b.innerHTML = `<span class="nav-item-icon">${s.ico}</span><span>${s.label}</span>`;
        b.addEventListener('click', () => { location.hash = '#' + s.key; closeDrawer(); });
        drawerNav.appendChild(b);
      });
    }

    function openDrawer() {
      document.getElementById('mobile-drawer').classList.add('open');
      document.getElementById('drawer-overlay').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('mobile-drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('open');
    }

    document.getElementById('hamburger-btn').addEventListener('click', openDrawer);
    document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
    document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    function setActive(key) {
      nav.querySelectorAll('.nav-item').forEach(b =>
        b.classList.toggle('active', b.dataset.section === key));
      if (drawerNav) drawerNav.querySelectorAll('.nav-item').forEach(b =>
        b.classList.toggle('active', b.dataset.section === key));
      const title = document.getElementById('admin-title');
      if (title) title.textContent = LABELS[key] || 'Panel';
    }

    // FADM-P15: wszystkie 18 sekcji sportowane do modularnego admin/. admin3 wycofany.

    function placeholder(key) {
      return `<div class="section active"><div class="adm-placeholder">
        <h2>Sekcja „${LABELS[key] || key}"</h2>
        <p>Nie udało się załadować modułu sekcji.</p>
        <p style="color:var(--t3)">Odśwież stronę lub sprawdź konsolę przeglądarki.</p>
      </div></div>`;
    }

    async function route() {
      let key = (location.hash || '').replace(/^#/, '');
      if (!KEYS.includes(key)) key = localStorage.getItem(LAST_KEY) || 'overview';
      if (!KEYS.includes(key)) key = 'overview';
      localStorage.setItem(LAST_KEY, key);
      setActive(key);
      const panelRoot = document.getElementById('panel');
      panelRoot.innerHTML = '';
      const section = document.createElement('div');
      section.className = 'section active';
      panelRoot.appendChild(section);
      try {
        // Sekcja portowana → sections/<key>.js eksportuje init(panel).
        const mod = await import(`./sections/${key}.js?v=113`);
        if (mod && typeof mod.init === 'function') {
          await mod.init(section);
          // Auto-enhance tables already in DOM after init (sort + resize + filter — #591)
          section.querySelectorAll('table.data-table').forEach(t => enhanceTable(t));
          return;
        }
        panelRoot.innerHTML = placeholder(key);
      } catch (e) {
        // Ported, ale błąd importu → widoczny placeholder (nie cichy redirect, by nie maskować buga).
        console.error('[admin route] import sekcji nie powiódł się:', key, e);
        panelRoot.innerHTML = placeholder(key);
      }
    }

    // ── Auth (FADM-P13) ──────────────────────────────────────────────────────
    const LOGGED_IN_USER_KEY = 'aigm_admin_user';

    function showLogin() { document.getElementById('login-overlay').classList.add('open'); }
    function hideLogin() { document.getElementById('login-overlay').classList.remove('open'); }

    function _updateUserDisplay(username) {
      const nameEl = document.getElementById('user-name');
      const avatarEl = document.getElementById('user-avatar');
      if (nameEl) nameEl.textContent = username || 'Admin';
      if (avatarEl) avatarEl.textContent = (username || 'A')[0].toUpperCase();
    }

    async function doLogin() {
      const btn = document.getElementById('login-submit');
      const err = document.getElementById('login-err');
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = 'Logowanie…';
      try {
        const res = await fetch('/api/admin/dev-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass }),
        });
        const body = await res.json();
        if (!res.ok || !body.token) throw new Error(body.detail || `HTTP ${res.status}`);
        localStorage.setItem('aigm_admin_token', body.token);
        if (body.username) {
          localStorage.setItem(LOGGED_IN_USER_KEY, body.username);
          _updateUserDisplay(body.username);
        }
        hideLogin();
        route();
      } catch (e) {
        err.textContent = e.message || 'Błąd logowania';
        err.classList.add('show');
      } finally {
        btn.disabled = false; btn.textContent = 'Zaloguj się';
      }
    }

    function doLogout() {
      localStorage.removeItem('aigm_admin_token');
      localStorage.removeItem(LOGGED_IN_USER_KEY);
      _updateUserDisplay('Admin');
      showLogin();
    }

    // Expose globally — onclick="doLogin()" / onclick="doLogout()" w HTML
    window.doLogin = doLogin;
    window.doLogout = doLogout;

    document.getElementById('login-submit').addEventListener('click', doLogin);
    document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // ────────────────────────────────────────────────────────────────────────
    window.addEventListener('hashchange', route);
    window.addEventListener('admin-unauthorized', () => showLogin());

    // MutationObserver — auto-init sorting on any table.data-table added to #panel at any time
    // (catches lazy-loaded tab tables that appear after init() returns)
    const _panel = document.getElementById('panel');
    const _tableObserver = new MutationObserver(mutations => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.nodeType !== 1) continue;
          if (node.matches && node.matches('table.data-table')) {
            enhanceTable(node);
          } else if (node.querySelectorAll) {
            node.querySelectorAll('table.data-table').forEach(t => enhanceTable(t));
          }
        }
      }
    });
    _tableObserver.observe(_panel, { childList: true, subtree: true });

    // Load pending items count for Świat badge
    async function _loadPendingCount() {
      try {
        const [npcRes, enemyRes, weapRes, itemRes] = await Promise.allSettled([
          apiFetch('/api/admin/world/pending/npcs'),
          apiFetch('/api/admin/world/pending/enemies'),
          apiFetch('/api/admin/world/pending/weapons'),
          apiFetch('/api/admin/world/pending/items'),
        ]);
        const npcs    = npcRes.status==='fulfilled'   ? (npcRes.value?.items||npcRes.value||[])     : [];
        const enemies = enemyRes.status==='fulfilled' ? (enemyRes.value?.items||enemyRes.value||[]) : [];
        const weapons = weapRes.status==='fulfilled'  ? (weapRes.value?.items||weapRes.value||[])   : [];
        const items   = itemRes.status==='fulfilled'  ? (itemRes.value?.items||itemRes.value||[])   : [];
        const total = npcs.length + enemies.length + weapons.length + items.length;
        const badge = document.getElementById('world-nav-badge');
        if (badge) {
          badge.textContent = total || '';
          badge.style.display = total ? '' : 'none';
        }
      } catch (e) {
        // Silent fail if pending count can't load
      }
    }

    // Load duplicate-content count for Przedmioty badge (#1399)
    async function _loadDupCount() {
      try {
        const d = await apiFetch('/api/admin/duplicates/count');
        const badge = document.getElementById('content-nav-badge');
        if (badge) {
          badge.textContent = d.count || '';
          badge.style.display = d.count ? '' : 'none';
        }
      } catch (e) {
        // Silent fail if duplicate count can't load
      }
    }

    // expose shared do debug (sekcje importują własne moduły, to tylko wygoda)
    window.__adminShell = { apiFetch, showToast, SECTIONS, _loadPendingCount, _loadDupCount };

    // Przy starcie: brak tokenu → od razu login, nie czekaj na 401.
    const _initToken = localStorage.getItem('aigm_admin_token');
    if (!_initToken) {
      showLogin();
    } else {
      const _savedUser = localStorage.getItem(LOGGED_IN_USER_KEY);
      if (_savedUser) _updateUserDisplay(_savedUser);
      _loadPendingCount();
      _loadDupCount();
      route();
    }
  </script>
</body>
</html>
