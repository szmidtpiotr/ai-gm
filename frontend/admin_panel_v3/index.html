  let _seSchemaFields = [], _seDraft = {}, _seExistingKey = null;
  const _seSchemaCache = {};

  function _seGenId() { return 'se-' + Math.random().toString(36).slice(2,10); }
  function _seSlugify(str) {
    const map = {'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','Ą':'a','Ć':'c','Ę':'e','Ł':'l','Ń':'n','Ó':'o','Ś':'s','Ź':'z','Ż':'z'};
    return str.split('').map(c => map[c]||c).join('').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'').slice(0,50);
  }

  function _seEnsureOverlay() {
    if (_seOverlay) return _seOverlay;
    const el = document.createElement('div');
    el.id = 'smart-entry-overlay';
    el.className = 'smart-entry-overlay';
    el.innerHTML = `
      <div class="smart-entry-panel">
        <div class="smart-entry-header">
          <span class="smart-entry-title">🤖 Kreator AI</span>
          <select id="se-table-select" class="form-input" style="font-size:0.82rem;padding:4px 8px;margin-left:8px;flex:0 0 auto;width:auto">
            ${SE_SUPPORTED.map(t => `<option value="${t}">${SE_TABLE_LABELS[t]}</option>`).join('')}
          </select>
          <span style="flex:1"></span>
          <button class="smart-entry-close" id="se-close-btn" type="button">✕ Zamknij</button>
        </div>
        <div class="smart-entry-body">
          <div class="smart-entry-chat-col">
            <div class="smart-entry-messages" id="se-messages"></div>
            <div class="se-mode-badge" id="se-mode-badge">✨ Tryb tworzenia</div>
            <div class="smart-entry-input-row" style="align-items:flex-end">
              <textarea id="se-input" class="form-input" placeholder="Opisz rekord który chcesz stworzyć…" rows="3" maxlength="1000" style="resize:vertical;min-height:60px;flex:1"></textarea>
              <button class="btn btn-primary" id="se-send-btn" type="button">Wyślij</button>
            </div>
          </div>
          <div class="smart-entry-form-col">
            <div class="se-form-toolbar">
              <select id="se-existing-select" class="form-input" style="flex:1;font-size:0.82rem">
                <option value="">+ Nowy rekord</option>
              </select>
              <button class="btn btn-secondary btn-sm" id="se-load-btn" type="button" style="font-size:0.78rem;white-space:nowrap">Załaduj</button>
            </div>
            <div id="se-form-fields" class="se-form-fields-panel"></div>
            <div class="se-form-footer">
              <button class="btn btn-primary" id="se-save-btn" type="button" disabled style="width:100%">✅ Zapisz rekord</button>
            </div>
          </div>
        </div>
      </div>`;
    document.body.appendChild(el);
    _seOverlay = el;
    el.querySelector('#se-close-btn').addEventListener('click', closeSmartEntry);
    el.addEventListener('click', e => { if (e.target === el) closeSmartEntry(); });
    el.querySelector('#se-send-btn').addEventListener('click', _seSend);
    el.querySelector('#se-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); _seSend(); } });
    el.querySelector('#se-table-select').addEventListener('change', e => { _seSwitchTable(e.target.value); });
    el.querySelector('#se-load-btn').style.display = 'none';
    const _seHandleSelectChange = async () => {
      const key = el.querySelector('#se-existing-select').value;
      if (!key) {
        _seDraft = {}; _seExistingKey = null;
        _seRenderFormValues(); _seUpdateSaveBtn(); _seUpdateModeBadge();
        el.querySelector('#se-messages').innerHTML = '';
        _seAppendMsg('Tryb nowego rekordu — opisz co chcesz stworzyć.', 'agent');
        return;
      }
      await _seLoadExisting(key);
    };
    el.querySelector('#se-load-btn').addEventListener('click', _seHandleSelectChange);
    el.querySelector('#se-existing-select').addEventListener('change', _seHandleSelectChange);
    el.querySelector('#se-save-btn').addEventListener('click', _seSave);
    return el;
  }

  async function _seFetchSchema(table) {
    if (_seSchemaCache[table]) return _seSchemaCache[table];
    const d = await apiFetch(`/api/admin/smart-entry/schema?table=${table}`);
    _seSchemaCache[table] = d;
    return d;
  }
  async function _seFetchList(table) {
    try { const d = await apiFetch(`/api/admin/smart-entry/list?table=${table}`); return d.items || []; }
    catch { return []; }
  }

  async function _seSwitchTable(table) {
    _seCurrentTable = table;
    _seDraft = {}; _seExistingKey = null; _seSessionId = _seGenId();
    if (_seOverlay) {
      _seOverlay.querySelector('#se-messages').innerHTML = '';
      _seOverlay.querySelector('#se-form-fields').innerHTML = `<div style="padding:16px;color:var(--t3)">Ładowanie schematu…</div>`;
      _seAppendMsg(`Tabela: ${SE_TABLE_LABELS[table]||table}. Opisz rekord lub wybierz istniejący z listy po prawej.`, 'agent');
    }
    try {
      const schema = await _seFetchSchema(table);
      _seSchemaFields = schema.fields || [];
      _seRenderFormFields();
      _seUpdateSaveBtn();
      _seUpdateModeBadge();
    } catch(e) { _showToast('Błąd schematu: '+e.message, 'error'); }
    const items = await _seFetchList(table);
    if (_seOverlay) {
      const sel = _seOverlay.querySelector('#se-existing-select');
      sel.innerHTML = `<option value="">+ Nowy rekord</option>`;
      items.forEach(it => {
        const o = document.createElement('option');
        o.value = it.key;
        o.textContent = it.label ? `${it.label} (${it.key})` : it.key;
        sel.appendChild(o);
      });
    }
  }

  function _seRenderFormFields() {
    const container = _seOverlay.querySelector('#se-form-fields');
    container.innerHTML = '';
    _seSchemaFields.forEach(field => {
      const row = document.createElement('div');
      row.className = 'se-field-row' + (field.required ? ' required' : '');
      row.dataset.fieldKey = field.key;
      const lbl = document.createElement('div');
      lbl.className = 'se-field-label';
      lbl.textContent = field.label + (field.required ? ' *' : '');
      row.appendChild(lbl);
      const input = _seBuildInput(field);
      _seBindInputEvents(input, field);
      row.appendChild(input);
      container.appendChild(row);
    });
  }

  function _seBuildInput(field) {
    let el;
    if (field.type === 'single_choice' && field.options) {
      el = document.createElement('select');
      el.className = 'se-field-input';
      const empty = document.createElement('option');
      empty.value = ''; empty.textContent = '— wybierz —';
      el.appendChild(empty);
      field.options.forEach(opt => {
        const o = document.createElement('option');
        const val = typeof opt === 'object' ? (opt.label || opt.value) : opt;
        o.value = val;
        o.textContent = val + (opt.description ? ` — ${opt.description}` : '');
        el.appendChild(o);
      });
    } else if (field.type === 'boolean') {
      const wrap = document.createElement('label');
      wrap.className = 'se-bool-wrap';
      el = document.createElement('input');
      el.type = 'checkbox';
      el.className = 'se-field-checkbox';
      wrap.appendChild(el);
      wrap.dataset.fieldKey = field.key;
      return wrap;
    } else if (field.type === 'number') {
      el = document.createElement('input');
      el.type = 'number';
      el.className = 'se-field-input';
      if (field.min !== undefined) el.min = field.min;
      if (field.max !== undefined) el.max = field.max;
    } else if (field.type === 'multi_choice' && field.options) {
      el = document.createElement('div');
      el.className = 'se-multi-choice';
      field.options.forEach(opt => {
        const val = typeof opt === 'object' ? (opt.label || opt.value) : opt;
        const lbl = document.createElement('label');
        lbl.className = 'se-multi-option';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = val;
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(' ' + val));
        el.appendChild(lbl);
      });
    } else if (field.type === 'textarea') {
      el = document.createElement('textarea');
      el.className = 'se-field-textarea';
      el.rows = 3;
      if (field.placeholder) el.placeholder = field.placeholder.slice(0,120);
    } else {
      el = document.createElement('input');
      el.type = 'text';
      el.className = 'se-field-input';
      if (field.placeholder) el.placeholder = field.placeholder.slice(0,80);
    }
    el.dataset.fieldKey = field.key;
    return el;
  }

  function _seBindInputEvents(el, field) {
    const update = () => {
      _seDraft[field.key] = _seReadValue(field, el);
      _seUpdateFieldRow(field.key);
      _seUpdateSaveBtn();
      const r = _seOverlay?.querySelector(`.se-field-row[data-field-key="${field.key}"]`);
      if (r) r.classList.remove('se-field-changed--marked');
      if (field.key === 'label') {
        const keyField = _seSchemaFields.find(f => f.key === 'key');
        if (keyField && !_seDraft['key']) {
          const slug = _seSlugify(String(_seDraft['label']||''));
          const keyRow = _seOverlay.querySelector(`[data-field-key="key"]`);
          const keyInput = keyRow ? keyRow.querySelector('input,select') : null;
          if (keyInput) { keyInput.value = slug; _seDraft['key'] = slug; _seUpdateFieldRow('key'); }
        }
      }
    };
    if (el.tagName === 'LABEL') {
      el.querySelector('input')?.addEventListener('change', update);
    } else if (el.classList.contains('se-multi-choice')) {
      el.querySelectorAll('input').forEach(cb => cb.addEventListener('change', update));
    } else {
      el.addEventListener('input', update);
      el.addEventListener('change', update);
    }
  }

  function _seReadValue(field, el) {
    if (field.type === 'boolean') {
      const cb = el.tagName === 'LABEL' ? el.querySelector('input') : el;
      return cb?.checked ? 1 : 0;
    }
    if (field.type === 'multi_choice') {
      return Array.from(el.querySelectorAll('input:checked')).map(c => c.value).join(',');
    }
    return el.value || '';
  }

  function _seRenderFormValues() {
    if (!_seOverlay) return;
    _seSchemaFields.forEach(field => {
      const row = _seOverlay.querySelector(`.se-field-row[data-field-key="${field.key}"]`);
      if (!row) return;
      const val = _seDraft[field.key] ?? '';
      const el = row.querySelector('input,select,textarea,div.se-multi-choice');
      if (!el) return;
      if (field.type === 'boolean') {
        const cb = row.querySelector('input[type=checkbox]');
        if (cb) cb.checked = !!val;
      } else if (field.type === 'multi_choice') {
        const vals = String(val).split(',').filter(Boolean);
        el.querySelectorAll('input').forEach(cb => { cb.checked = vals.includes(cb.value); });
      } else {
        el.value = val;
      }
      _seUpdateFieldRow(field.key);
    });
  }

  function _seUpdateFieldRow(key) {
    if (!_seOverlay) return;
    const row = _seOverlay.querySelector(`.se-field-row[data-field-key="${key}"]`);
    if (!row) return;
    const v = _seDraft[key];
    row.classList.toggle('filled', !!(v !== undefined && v !== '' && v !== null));
  }

  function _seUpdateSaveBtn() {
    const btn = _seOverlay?.querySelector('#se-save-btn');
    if (!btn) return;
    const allFilled = _seSchemaFields.filter(f => f.required).every(f => {
      const v = _seDraft[f.key];
      return v !== undefined && v !== '' && v !== null;
    });
    btn.disabled = !allFilled;
    btn.textContent = _seExistingKey ? '✅ Zaktualizuj rekord' : '✅ Zapisz rekord';
  }

  async function _seLoadExisting(key) {
    try {
      const rec = await apiFetch(`/api/admin/smart-entry/record?table=${_seCurrentTable}&key=${encodeURIComponent(key)}`);
      _seDraft = { ...rec };
      _seExistingKey = key;
      _seSessionId = _seGenId();
      _seRenderFormValues();
      _seUpdateSaveBtn();
      _seUpdateModeBadge();
      if (_seOverlay) {
        _seOverlay.querySelector('#se-messages').innerHTML = '';
        _seAppendMsg(`Załadowano: "${rec.label||key}". Opisz co chcesz zmienić.`, 'agent');
      }
    } catch(e) { _showToast('Błąd ładowania: '+e.message, 'error'); }
  }

  function _seUpdateModeBadge() {
    const badge = _seOverlay?.querySelector('#se-mode-badge');
    const input = _seOverlay?.querySelector('#se-input');
    if (!badge) return;
    const hasContent = Object.values(_seDraft).some(v => v !== undefined && v !== '' && v !== null);
    if (hasContent) {
      badge.textContent = '🔄 Tryb uzupełniania';
      badge.classList.add('refine');
      if (input) input.placeholder = 'Opisz co chcesz zmienić…';
    } else {
      badge.textContent = '✨ Tryb tworzenia';
      badge.classList.remove('refine');
      if (input) input.placeholder = 'Opisz rekord który chcesz stworzyć…';
    }
  }

  function _seFlashChanged(fields) {
    if (!_seOverlay) return;
    _seOverlay.querySelectorAll('.se-field-changed--marked').forEach(r => r.classList.remove('se-field-changed--marked'));
    (fields||[]).forEach(key => {
      const row = _seOverlay.querySelector(`.se-field-row[data-field-key="${key}"]`);
      if (!row) return;
      row.classList.add('se-field-changed');
      row.classList.add('se-field-changed--marked');
      setTimeout(() => row.classList.remove('se-field-changed'), 2000);
    });
  }

  async function _seSend() {
    const input = _seOverlay.querySelector('#se-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    _seAppendMsg(text, 'user');
    await _seCallAgent(text);
  }

  async function _seCallAgent(message) {
    const sendBtn = _seOverlay.querySelector('#se-send-btn');
    sendBtn.disabled = true;
    const typing = _seAppendMsg('…', 'agent');
    try {
      const r = await apiFetch('/api/admin/smart-entry/message', {
        method:'POST',
        body: JSON.stringify({
          session_id: _seSessionId,
          table: _seCurrentTable,
          message,
          current_draft: _seDraft,
          target_key: _seExistingKey || null,
        }),
      });
      typing.remove();
      if (r.reply) {
        const m = _seAppendMsg(r.reply, 'agent');
        if (r.delta && m) {
          const bubble = m.querySelector('.chat-bubble');
          if (bubble) {
            const dEl = document.createElement('div');
            dEl.className = 'chat-delta';
            dEl.textContent = r.delta;
            bubble.appendChild(dEl);
          }
        }
      }
      if (r.draft && typeof r.draft === 'object') {
        _seDraft = { ..._seDraft, ...Object.fromEntries(Object.entries(r.draft).filter(([,v]) => v !== null && v !== undefined)) };
        _seRenderFormValues();
        _seFlashChanged(Array.isArray(r.changed_fields) ? r.changed_fields : []);
        _seUpdateSaveBtn();
        _seUpdateModeBadge();
      }
    } catch(e) {
      typing.remove();
      _seAppendMsg(`Błąd: ${e.message||JSON.stringify(e)}`, 'agent error');
    } finally { sendBtn.disabled = false; }
  }

  async function _seSave() {
    const btn = _seOverlay.querySelector('#se-save-btn');
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Zapisuję…';
    try {
      const r = await apiFetch('/api/admin/smart-entry/save', {
        method:'POST',
        body: JSON.stringify({
          session_id: _seSessionId,
          draft: _seDraft,
          table: _seCurrentTable,
          target_key: _seExistingKey || null,
        }),
      });
      const verb = r.mode === 'update' ? 'Zaktualizowano' : 'Zapisano';
      _showToast(`${verb}: ${r.key}`, 'success');
      _seAppendMsg(`✓ Rekord "${r.key}" ${r.mode==='update'?'zaktualizowany':'zapisany'}. Możesz tworzyć kolejny lub zamknąć.`, 'agent success');
      window.dispatchEvent(new CustomEvent('smart-entry-saved', { detail: { table: r.table || _seCurrentTable, key: r.key, mode: r.mode } }));
      _seDraft = {}; _seExistingKey = null; _seSessionId = _seGenId();
      if (_seOverlay) {
        _seOverlay.querySelector('#se-existing-select').value = '';
        _seRenderFormValues();
        _seUpdateSaveBtn();
        _seUpdateModeBadge();
      }
    } catch(e) {
      _showToast(e.message || 'Błąd zapisu.', 'error');
      btn.textContent = orig;
      _seUpdateSaveBtn();
    }
  }

  function _seAppendMsg(text, type) {
    if (!_seOverlay) return { remove: () => {} };
    const messages = _seOverlay.querySelector('#se-messages');
    const div = document.createElement('div');
    div.className = `chat-msg ${type}`;
    div.innerHTML = `<div class="chat-bubble">${_esc(text).replace(/\n/g, '<br>')}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function openSmartEntry(table) {
    const overlay = _seEnsureOverlay();
    overlay.classList.add('visible');
    _seSessionId = _seGenId();
    const sel = overlay.querySelector('#se-table-select');
    const target = table || sel.value || SE_SUPPORTED[0];
    if (sel.value !== target) sel.value = target;
    await _seSwitchTable(target);
  }
  function closeSmartEntry() { if (_seOverlay) _seOverlay.classList.remove('visible'); }

  // Map active content tab → backend table key
  function openSmartEntryForCurrentTab() {
    const activeTab = document.querySelector('#content-tabs .stab.active')?.dataset?.tab || 'weapons';
    const map = {
      weapons: 'game_config_weapons',
      items: 'game_config_items',
      consumables: 'game_config_consumables',
      enemies: 'game_config_enemies',
    };
    const table = map[activeTab];
    if (!table) {
      _showToast('Kreator AI nie obsługuje jeszcze tej zakładki — wybierz Broń / Przedmioty / Konsumable / Wrogowie.', 'warn');
      return;
    }
    openSmartEntry(table);
  }

  async function openSmartEntryForDbItem(entryType, key) {
    const typeMap = { weapon:'weapon', armor:'item', item:'item', consumable:'consumable' };
    const modalType = typeMap[entryType] || entryType;
    const data = (window._tplDbItemsByType?.[entryType] || []).find(x => x.key === key) || { key };
    // Map DB item to entity modal format (overrides = the data itself)
    const entityData = { ...data, entity_type: modalType };
    // Open modal in 'db_item' mode — save will PATCH the DB record, not edit plan JSON
    _tplEntityCtx = { listKey: 'db_item', idx: -1, type: modalType, dbKey: key, dbEntryType: entryType };
    const modal = document.getElementById('tpl-entity-modal');
    const typeLabels = { weapon:'Broń (DB)', item:'Przedmiot (DB)', consumable:'Mikstura (DB)', location:'Lokacja' };
    document.getElementById('tpl-entity-modal-type-badge').textContent = typeLabels[modalType] || modalType;
    document.getElementById('tpl-entity-modal-title').textContent = data.label || data.key || '(DB)';
    document.getElementById('tpl-entity-campaign-specific').checked = false;
    document.getElementById('tpl-entity-campaign-specific').parentElement.style.display = 'none'; // hide for DB items
    document.getElementById('tpl-entity-form').innerHTML = _renderEntityForm(modalType, entityData);
    if (modalType === 'item' || modalType === 'weapon' || modalType === 'consumable') _ejPopulate(entityData.effect_json ?? null);
    document.getElementById('tpl-entity-delete-btn').style.display = 'none'; // no delete from here
    modal.style.display = 'flex';
  }

  function _copyMcpPrompt(elemId) {
    const el = document.getElementById(elemId);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(() => _showToast('Skopiowano ✓', 'success'));
  }

  // Auto-refresh tables when Smart Entry saves
  window.addEventListener('smart-entry-saved', e => {
    const t = e.detail?.table;
    if (t === 'game_config_enemies') { _contentLoaded.delete('enemies'); _loadEnemiesContent(); }
  });

  // ── Szczegóły column toggle ─────────────────────────────
  function _toggleDetails(tableId, btn) {
    const t = document.getElementById(tableId);
    if (!t) return;
    const on = t.classList.toggle('show-details');
    if (btn) btn.classList.toggle('active', on);
    try { localStorage.setItem(`v3_det_${tableId}`, on ? '1' : '0'); } catch {}
  }
  function _restoreDetailsToggle(tableId) {
    try {
      if (localStorage.getItem(`v3_det_${tableId}`) === '1') {
        const t = document.getElementById(tableId);
        if (t) t.classList.add('show-details');
        const btn = document.querySelector(`[data-details-for="${tableId}"]`);
        if (btn) btn.classList.add('active');
      }

  }

  // ── Auth ────────────────────────────────────────────────
  function _showLogin() { document.getElementById('login-overlay').classList.add('open'); }
  function _hideLogin() { document.getElementById('login-overlay').classList.remove('open'); }

  async function doLogin() {
    const btn = document.getElementById('login-submit');
    const err = document.getElementById('login-err');
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Logowanie…';
    try {
      const res = await fetch(_buildUrl('/api/admin/dev-login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass }),
      });
      const body = await res.json();
      if (!res.ok || !body.token) throw new Error(body.detail || `HTTP ${res.status}`);
      localStorage.setItem(_ADMIN_TOKEN_KEY, body.token);
      _hideLogin();
      _triggerCurrent();
    } catch (e) {
      err.textContent = e.message || 'Błąd logowania';
      err.classList.add('show');
    } finally {
      btn.disabled = false; btn.textContent = 'Zaloguj się';
    }
  }

  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // ── Loader dispatch ─────────────────────────────────────
  function _triggerCurrent() {
    const active = document.querySelector('.section.active');
    if (active) _load(active.id.replace('section-', ''));
  }

  function _load(key) {
    if (_sectionLoaded.has(key)) return;
    const fn = {
      world:()=>_loadWorldTab('npcs'),
      players:_loadPlayers,
      system:_loadSystem, invites:_loadInvites, bugreports:_loadBugReports,
      tools:_loadTools, push:_loadPush }[key];
    if (!fn) return;
    _sectionLoaded.add(key);
    // Promise.resolve: część loaderów (mechanics) to void-arrow → fn() zwraca undefined;
    // bezpośrednie .catch rzucało nieobsłużony wyjątek (pre-existing, ujawnione przy #403 anty-grób).
    Promise.resolve(fn()).catch(err => { _sectionLoaded.delete(key); console.warn('Load failed:', key, err.message); });
  }




  // ── Render helpers ──────────────────────────────────────
  const _esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Phase 5.1: prefer real DB rarity (1-5), fall back to value_gp heuristic for older records
  function _stars(gpOrRecord, rarity) {
    let n;
    if (typeof gpOrRecord === 'object' && gpOrRecord !== null) {
      n = gpOrRecord.rarity != null ? gpOrRecord.rarity : (gpOrRecord.value_gp||0);
      if (gpOrRecord.rarity == null) n = n>1000?5:n>400?4:n>150?3:n>50?2:1;
    } else if (rarity != null) {
      n = rarity;
    } else {
      const gp = gpOrRecord;
      n = (gp||0)>1000?5:(gp||0)>400?4:(gp||0)>150?3:(gp||0)>50?2:1;
    }
    n = Math.max(1, Math.min(5, Math.round(n)));
    return `<span class="stars">${[1,2,3,4,5].map(i=>`<span class="star ${i<=n?'on':'off'}">★</span>`).join('')}</span>`;
  }

  function _hp(cur, max) {
    if (!max) return '<span class="td-muted">—</span>';
    const pct = Math.round(cur / max * 100);
    const cls = pct > 60 ? 'high' : pct > 30 ? 'mid' : 'low';
    const col = pct <= 30 ? ' style="color:var(--red)"' : '';
    return `<div class="hp-wrap"><div class="hp-bar"><div class="hp-fill ${cls}" style="width:${pct}%"></div></div><span class="hp-label"${col}>${cur}/${max}</span></div>`;
  }

  const _loading = cols => `<tr><td colspan="${cols}" style="text-align:center;padding:28px;color:var(--t3);font-size:0.8rem">Ładowanie…</td></tr>`;
  const _errRow  = (cols, msg) => `<tr><td colspan="${cols}" style="text-align:center;padding:28px;color:var(--red);font-size:0.8rem">${_esc(msg)}</td></tr>`;

  function _timeAgo(iso) {
    if (!iso) return '';
    const diff = Math.round((Date.now() - new Date(iso)) / 1000);
    if (diff < 60) return 'przed chwilą';
    if (diff < 3600) return `${Math.round(diff/60)} min temu`;
    if (diff < 86400) return `${Math.round(diff/3600)} godz. temu`;
    return `${Math.round(diff/86400)} dni temu`;
  }

      ]);
      const camps = activity.items || activity.campaigns || [];
      const usesRemaining = resUses.uses_remaining;  // null = bez limitu (∞)
      const globalResEnabled = resCfg ? !!(resCfg.enabled) : true;
      const STATUS = { active:'Aktywna', ended:'Zakończona', aborted:'Przerwana' };

            const pct = (hp!=null && maxHp) ? Math.round((hp/maxHp)*100) : null;

            const lastT = c.last_turn_at ? new Date(c.last_turn_at).toLocaleDateString('pl-PL') : '—';
            const isDead = c.char_status === 'dead' || (c.char_current_hp != null && c.char_current_hp <= 0);
            return `
            <div class="card" style="padding:10px;margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <div style="font-weight:600">${_esc(c.title||'Kampania '+(c.id||''))}</div>

              ${pct!==null ? `<div class="hp-bar" style="margin-top:6px"><div class="hp-fill ${tone}" style="width:${pct}%"></div></div><div style="font-size:0.7rem;color:var(--t3);margin-top:2px">${hp}/${maxHp} HP</div>` : ''}
              <div style="font-size:0.72rem;color:var(--t3);margin-top:4px">Tury: ${c.turn_count ?? '—'} · Ostatnia: ${lastT}</div>

  // ── Voice ───────────────────────────────────────────────
  let _voiceConfig = null;

  async function _loadVoice() {
    const badge = document.getElementById('voice-status-badge');
    _loadVoiceHosts();
    try {
      const [health, config, voicesResp] = await Promise.all([
        apiFetch('/voice/healthz').catch(() => null),
        apiFetch('/voice/config'),
        apiFetch('/voice/voices').catch(() => ({ voices: [] })),
      ]);
      _voiceConfig = config;

      if (badge) badge.innerHTML = health ? '<span class="badge badge-green">● Online</span>' : '<span class="badge badge-amber">⚠ Niedostępny</span>';

      const setBadge = (id, val) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = val ? '<span class="badge badge-green">Włączony</span>' : '<span class="badge badge-slate">Wyłączony</span>';
      };
      const setInp = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = val; };
      const setChk = (id, val) => { const el = document.getElementById(id); if (el) el.checked = !!val; };

      setBadge('v-tts-enabled', config.tts_enabled);
      setBadge('v-stt-enabled', config.stt_enabled);

      // TTS editable fields
      const voiceSel = document.getElementById('v-voice-select');
      if (voiceSel) {
        const voices = voicesResp.voices || [];
        voiceSel.innerHTML = voices.map(v => `<option value="${_esc(v)}" ${v===config.tts_voice?'selected':''}>${_esc(v)}</option>`).join('');
      }
      const setSlider = (inputId, valId, val, digits) => {
        const el = document.getElementById(inputId);
        const vEl = document.getElementById(valId);
        if (el && val != null) { el.value = val; }
        if (vEl && val != null) { vEl.textContent = digits != null ? parseFloat(val).toFixed(digits) : val; }
      };
      setSlider('v-tts-speed-input', 'v-tts-speed-val', config.tts_speed, 2);
      setSlider('v-tts-noise-input', 'v-tts-noise-val', config.tts_noise_scale, 2);
      setSlider('v-tts-nfe-input', 'v-tts-nfe-val', config.tts_nfe_step, 0);
      setSlider('v-tts-cfg-input', 'v-tts-cfg-val', config.tts_cfg_strength, 1);
      setSlider('v-tts-crossfade-input', 'v-tts-crossfade-val', config.tts_cross_fade_duration, 2);
      setSlider('v-tts-sway-input', 'v-tts-sway-val', config.tts_sway_sampling_coef, 2);
      const seedVal = config.tts_seed ?? -1;
      const seedRandom = seedVal === -1;
      const seedChk = document.getElementById('v-tts-seed-random');
      const seedInp = document.getElementById('v-tts-seed-input');
      if (seedChk) seedChk.checked = seedRandom;
      if (seedInp) { seedInp.value = seedVal; seedInp.disabled = seedRandom; }

      // STT editable fields
      const modelSel = document.getElementById('v-stt-model-select');
      if (modelSel && config.stt_model) modelSel.value = config.stt_model;
      _renderWhisperPresets(config.stt_model || 'base');
      setInp('v-stt-lang-input', config.stt_language);
      setInp('v-stt-beam-input', config.stt_beam_size);
      setChk('v-stt-vad-check', config.vad_filter);
      setInp('v-stt-silence-input', config.stt_silence_auto_stop_ms);

      // Per-route TTS toggles (client-side, persisted to localStorage)
      const routeKey = r => `aigm_tts_${r}`;
      document.querySelectorAll('#v-route-toggles input[data-vroute]').forEach(el => {
        const r = el.dataset.vroute;
        try { el.checked = localStorage.getItem(routeKey(r)) !== '0'; } catch { el.checked = true; }
        if (!el._wired) {
          el._wired = true;
          el.addEventListener('change', () => {
            try { localStorage.setItem(routeKey(r), el.checked ? '1' : '0'); } catch {}
            _showToast(`${r}: ${el.checked ? 'TTS włączony' : 'TTS wyłączony'}`, 'info');
          });
        }
      });
    } catch(e) {
      if (badge) badge.innerHTML = '<span class="badge badge-red">✕ Błąd</span>';
      showToast('Głos: ' + e.message, 'error');
    }
  }

  function _onSeedRandomToggle() {
    const chk = document.getElementById('v-tts-seed-random');
    const inp = document.getElementById('v-tts-seed-input');
    if (!chk || !inp) return;
    inp.disabled = chk.checked;
    if (chk.checked) {
      inp.value = -1;
    } else {
      // Switch to fixed seed — default to 42 so saving won't re-trigger random mode
      if (parseInt(inp.value, 10) === -1) inp.value = 42;
    }
  }

  async function saveTTSConfig(btn) {
    const voice = document.getElementById('v-voice-select')?.value;
    const speed = parseFloat(document.getElementById('v-tts-speed-input')?.value);
    const noise = parseFloat(document.getElementById('v-tts-noise-input')?.value);
    const nfe = parseInt(document.getElementById('v-tts-nfe-input')?.value, 10);
    const cfg = parseFloat(document.getElementById('v-tts-cfg-input')?.value);
    const crossfade = parseFloat(document.getElementById('v-tts-crossfade-input')?.value);
    const sway = parseFloat(document.getElementById('v-tts-sway-input')?.value);
    const seedRandom = document.getElementById('v-tts-seed-random')?.checked;
    const seed = seedRandom ? -1 : parseInt(document.getElementById('v-tts-seed-input')?.value, 10);
    const payload = {};
    if (voice) payload.tts_voice = voice;
    if (!isNaN(speed)) payload.tts_speed = speed;
    if (!isNaN(noise)) payload.tts_noise_scale = noise;
    if (!isNaN(nfe)) payload.tts_nfe_step = nfe;
    if (!isNaN(cfg)) payload.tts_cfg_strength = cfg;
    if (!isNaN(crossfade)) payload.tts_cross_fade_duration = crossfade;
    if (!isNaN(sway)) payload.tts_sway_sampling_coef = sway;
    if (!isNaN(seed)) payload.tts_seed = seed;
    if (btn) btn.disabled = true;
    try {
      await apiFetch('/voice/config', { method:'POST', body:JSON.stringify(payload) });
      _sysTabLoaded.delete('voice'); _loadVoice();
      showToast('TTS zapisano.', 'success');
    } catch(e) { showToast('Błąd: '+e.message, 'error'); }
    finally { if (btn) btn.disabled = false; }
  }

      if (!hosts.length) { list.innerHTML = '<div style="color:var(--t3);font-size:0.82rem">Brak hostów.</div>'; return; }
      list.innerHTML = hosts.map(h => {
        const he = h.health || {};
        const online = he.online;
        const statusBadge = online
          ? '<span class="badge badge-green">● online</span>'
          : `<span class="badge badge-red">○ offline</span>`;
        const kindBadge = h.kind === 'gpu' ? '<span class="badge badge-amber">GPU</span>' : '<span class="badge badge-slate">CPU</span>';
        const model = online ? `TTS ${he.tts_loaded?'✓':'✗'} · STT ${he.stt_loaded?'✓':'✗'} · model: ${_esc(he.stt_model||'—')}` : _esc(he.error||'niedostępny');
        return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid ${h.is_active?'var(--blue-border)':'var(--border)'};border-radius:var(--r);background:${h.is_active?'var(--blue-light)':'var(--canvas)'}">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <strong style="font-size:0.85rem">${_esc(h.label)}</strong> ${kindBadge} ${statusBadge}
              ${h.is_active?'<span class="badge badge-blue">aktywny</span>':''}
            </div>
            <div class="mono" style="font-size:0.72rem;color:var(--t3);margin-top:2px">${_esc(h.base_url)}</div>
            <div style="font-size:0.72rem;color:var(--t3);margin-top:2px">${model}${online&&he.available_voices?` · głosy: ${he.available_voices.length}`:''}</div>
          </div>

  async function testTTS(btn) {
    const text = document.getElementById('vtest-text')?.value.trim();
    const status = document.getElementById('vtest-tts-status');
    if (!text) { showToast('Wpisz tekst.', 'error'); return; }
    btn.disabled = true; if (status) status.textContent = 'Generuję…';
    try {
      const speed = _voiceConfig?.tts_speed ?? 1.0;
      const url = `/voice/tts?text=${encodeURIComponent(text)}&speed=${speed}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const blob = await r.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      if (status) status.textContent = `OK — ${(blob.size/1024).toFixed(0)} KB, odtwarzam…`;
      audio.onended = () => { if (status) status.textContent = 'Gotowe.'; };
      await audio.play();
    } catch(e) { if (status) status.textContent = 'Błąd: '+e.message; showToast('TTS: '+e.message, 'error'); }
    finally { btn.disabled = false; }
  }

  let _vtestRec = null, _vtestWs = null;
  async function testSTT(btn) {
    const out = document.getElementById('vtest-stt-out');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/voice/stt`);
      _vtestWs = ws;
      ws.onmessage = (ev) => {
        try { const p = JSON.parse(ev.data||'{}'); if (p.text) out.textContent = `„${p.text}"`; else if (p.error) out.textContent = 'Błąd: '+p.error; }
        catch { /* ignore */ }
      };
      await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error('WS error')); setTimeout(()=>rej(new Error('WS timeout')), 8000); });
      const mimes = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
      const mime = mimes.find(m => MediaRecorder.isTypeSupported(m));
      const rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      _vtestRec = rec;
      rec.ondataavailable = (e) => { if (e.data?.size && ws.readyState===WebSocket.OPEN) ws.send(e.data); };
      rec.start(350);
      btn.disabled = true; out.textContent = 'Nagrywanie… (4 s)';
      setTimeout(() => {
        try { rec.stop(); } catch {}
        stream.getTracks().forEach(t => t.stop());
        if (ws.readyState===WebSocket.OPEN) { ws.send('__end__'); out.textContent = 'Transkrypcja…'; }
        setTimeout(() => { try { ws.close(); } catch {} btn.disabled = false; }, 4000);
      }, 4000);
    } catch(e) { out.textContent = 'Błąd: '+e.message; showToast('STT: '+e.message, 'error'); btn.disabled = false; }
  }

  async function _reloadSysDb() {
    const statsEl = document.getElementById('sys-db-stats');
    const tablesEl = document.getElementById('sys-db-tables');
    if (statsEl) statsEl.innerHTML = '<div style="color:var(--t3);padding:8px">Ładowanie…</div>';
    if (tablesEl) tablesEl.innerHTML = '';
    try {
      const d = await apiFetch('/api/admin/db/info');
      const mb = (Number(d.db_size_bytes||0) / 1024 / 1024).toFixed(2);
      if (statsEl) statsEl.innerHTML = [
        ['Ścieżka', `<span class="td-mono" style="word-break:break-all">${_esc(d.db_path||'—')}</span>`],
        ['Rozmiar', `${mb} MB`],
        ['SQLite', _esc(d.sqlite_version||'—')],
      ].map(([k,v]) => `<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`).join('');

      if (tablesEl) {
        const tables = [...(d.tables||[])].sort((a,b) => a.name.localeCompare(b.name));
        tablesEl.innerHTML = `<table class="data-table" style="font-size:0.8rem">
          <thead><tr><th>Tabela</th><th style="text-align:right">Wiersze</th></tr></thead>
          <tbody>${tables.map(t => `<tr>
            <td class="td-mono" style="font-size:0.75rem">${_esc(t.name)}</td>
            <td style="text-align:right;color:${t.row_count===0?'var(--t3)':'inherit'}">${t.row_count}</td>
          </tr>`).join('')}</tbody>
        </table>`;
      }
    } catch(e) {
      if (statsEl) statsEl.innerHTML = `<div style="color:var(--red,#e55)">${_esc(e.message)}</div>`;
    }
  }

      const blob = await resp.blob();

      _showToast('Pobieranie rozpoczęte.', 'success');

  async function sysConfigDryRun(btn) {
    const fileInp = document.getElementById('sys-config-file');
    const f = fileInp?.files?.[0];
    if (!f) return;
    btn.disabled = true; btn.textContent = '⏳';
    const commitBtn = document.getElementById('sys-commit-btn');
    const diffWrap = document.getElementById('sys-config-diff');
    _sysConfigParsed = null;
    try {
      const text = await f.text();
      const parsed = JSON.parse(text);
      if (!parsed?.tables) throw new Error('Nieprawidłowy plik: brak tables.');
      _sysConfigParsed = parsed;
      const res = await apiFetch('/api/admin/config/import?dry_run=true', { method: 'POST', body: JSON.stringify(parsed) });
      _sysConfigWarnings = res?.warnings || [];
      if (diffWrap) {
        diffWrap.style.display = '';
        const tables = parsed.tables || {};
        diffWrap.innerHTML = `
          <div style="font-size:0.8rem;font-weight:600;margin-bottom:6px">Dry Run — podgląd importu</div>
          ${_sysConfigWarnings.length ? `<div style="background:var(--amber,#f59e0b20);border:1px solid var(--amber,#f59e0b);border-radius:6px;padding:8px;font-size:0.78rem;margin-bottom:8px">${_sysConfigWarnings.map(w => _esc(w)).join('<br>')}</div>` : ''}
          <table class="data-table" style="font-size:0.78rem">
            <thead><tr><th>Tabela</th><th>Wiersze w pliku</th></tr></thead>
            <tbody>${Object.keys(tables).sort().map(k =>
              `<tr><td class="td-mono">${_esc(k)}</td><td>${Array.isArray(tables[k]) ? tables[k].length : 0}</td></tr>`
            ).join('')}</tbody>
          </table>`;
      }
      if (commitBtn) commitBtn.disabled = false;
      _showToast(_sysConfigWarnings.length ? 'Dry run z ostrzeżeniami.' : 'Dry run OK.', 'success');
    } catch(e) {
      _sysConfigParsed = null;
      if (diffWrap) { diffWrap.style.display = 'none'; diffWrap.innerHTML = ''; }
      _showToast(e instanceof SyntaxError ? 'Nieprawidłowy JSON.' : e.message || 'Błąd dry run.', 'error');
    } finally {
      btn.disabled = !fileInp?.files?.length;
      btn.textContent = '🔍 Dry Run';
    }
  }

  async function sysConfigCommit(btn) {
    if (!_sysConfigParsed) { _showToast('Najpierw uruchom dry run.', 'info'); return; }
    if (!confirm('Zatwierdzić import? Bieżąca konfiguracja zostanie zastąpiona.' +
      (_sysConfigWarnings.length ? `\n\nOstrzeżenia:\n- ${_sysConfigWarnings.join('\n- ')}` : ''))) return;
    btn.disabled = true; btn.textContent = '⏳';
    try {
      await apiFetch('/api/admin/config/import', { method: 'POST', body: JSON.stringify(_sysConfigParsed) });
      _showToast('Import zatwierdzony. Kopia DB utworzona automatycznie.', 'success');
      const fileInp = document.getElementById('sys-config-file');
      if (fileInp) fileInp.value = '';
      _sysConfigParsed = null;
      const diff = document.getElementById('sys-config-diff');
      if (diff) { diff.style.display = 'none'; }
      document.getElementById('sys-dry-btn').disabled = true;
      btn.disabled = true;
    } catch(e) {
      _showToast(e.message || 'Błąd importu.', 'error');
      btn.disabled = false;
    } finally { if (btn.textContent === '⏳') btn.textContent = '✅ Zatwierdź import'; }
  }

  const _VIS_PERIODS = [
    { key: 'rano',       label: 'Rano' },
    { key: 'popoludnie', label: 'Popołudnie' },
    { key: 'wieczor',    label: 'Wieczór' },

  const _VIS_SCREENS = ['login','heroes','campaigns','new-campaign','wizard','game','sheet','settings','death','victory'];

  async function _loadSysVisual() {
    _sysTabLoaded.add('visual');
    try {
      const [vis, bgs] = await Promise.all([
        apiFetch('/api/admin/visual'),
        apiFetch('/api/ui/backgrounds').catch(() => ({ backgrounds: {} })),
      ]);
      const s = vis.settings || {};

      const todEnabled = document.getElementById('vis-tod-enabled');
      if (todEnabled) todEnabled.checked = !!s['time_of_day.enabled'];
      const todMode = document.getElementById('vis-tod-mode');

      const periodsEl = document.getElementById('vis-periods');
      if (periodsEl) {
        periodsEl.innerHTML = _VIS_PERIODS.map(p => {
          const color = s[`time_of_day.${p.key}`]?.color || '#1a1a2e';
          const accent = s[`time_of_day.${p.key}`]?.accent || '#7c3aed';
          return `<div style="border:1px solid var(--border);border-radius:8px;padding:10px">

              <label style="font-size:0.75rem">Akcent</label>
              <input type="color" value="${_esc(accent)}" style="width:36px;height:28px;border:none;background:none;cursor:pointer"
                onchange="visSavePeriodColor('${p.key}','accent',this.value)" />
            </div>
            <div style="height:24px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,${color},${accent})"></div>
          </div>`;
        }).join('');
      }

      const bgGrid = document.getElementById('vis-bg-grid');
      if (bgGrid) {
        const bgMap = bgs.backgrounds || {};
        const _bgTs = Date.now();
        bgGrid.innerHTML = _VIS_SCREENS.map(scr => {
          const url = bgMap[scr];
          return `<div style="border:1px solid var(--border);border-radius:8px;padding:8px">
            <div style="font-size:0.75rem;font-weight:600;margin-bottom:6px">${scr}</div>
            ${url ? `<img src="${_esc(url)}?t=${_bgTs}" style="width:100%;height:60px;object-fit:cover;border-radius:4px;margin-bottom:6px" />` : `<div style="height:60px;background:var(--surface);border-radius:4px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:0.7rem">Brak</div>`}

    let modal = document.getElementById('vis-gallery-modal');

    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center';
    modal.innerHTML = `<div style="background:var(--surface);border-radius:12px;width:min(720px,95vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
        <strong>Galeria obrazów — ekran: ${screen}</strong>

      </div>
      <div id="vis-gallery-grid" style="padding:12px;overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
        <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--t3)">Ładowanie...</div>
      </div>
    </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

    const grid = document.getElementById('vis-gallery-grid');
    try {
      const data = await apiFetch('/api/admin/images/list');
      const imgs = data.images || [];
      if (!imgs.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--t3)">Brak obrazów w galerii. Wygeneruj je w zakładce Lokacje.</div>';
        return;
      }
      grid.innerHTML = imgs.map(img => {
        const enc = encodeURIComponent(img.url);
        const encF = encodeURIComponent(img.filename);
        return `<div onclick="visPickBgSelect('${_esc(screen)}','${enc}','${encF}')"
             style="border:2px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:border-color .15s"
             onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <img src="${_esc(img.url)}" style="width:100%;height:90px;object-fit:cover;display:block" loading="lazy" />
          <div style="padding:3px 5px;font-size:0.62rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${_esc(img.filename)}">${_esc(img.filename)}</div>
        </div>`;
      }).join('');
    } catch(e) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--danger)">${_esc(e.message)}</div>`;
    }
  }

  async function visPickBgSelect(screen, encUrl, encFilename) {
    document.getElementById('vis-gallery-modal')?.remove();

  async function _txtSave(key, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    const container = btn.closest('.card');
    const pick = (field) => {
      const el = container.querySelector(`[data-txt-key="${key}"][data-txt-field="${field}"]`);
      return el ? (el.value.trim() || null) : undefined;
    };
    // color: use typed hex value only; color picker is just a visual aid
    const payload = {
      custom_text:    pick('custom_text'),
      font_family:    pick('font_family'),
      font_size:      pick('font_size'),
      font_weight:    pick('font_weight'),
      color:          pick('color_hex'),
      text_transform: pick('text_transform'),
      letter_spacing: pick('letter_spacing'),
      extra_css:      pick('extra_css'),
    };
    // strip undefined fields
    Object.keys(payload).forEach(k => { if (payload[k] === undefined) delete payload[k]; });
    try {
      await apiFetch(`/api/admin/ui-texts/${key}`, {
        method: 'PATCH',
        body: JSON.stringify(payload),
      });
      _showToast('Zapisano.', 'success');
      const idx = _txtData.findIndex(t => t.key === key);
      if (idx >= 0) Object.assign(_txtData[idx], payload);
      _renderTxtList();
    } catch(e) {
      _showToast(e.message || 'Błąd zapisu.', 'error');
      btn.disabled = false; btn.textContent = 'Zapisz';
    }
  }

  async function _txtReset(key, btn) {
    if (!confirm(`Przywrócić oryginalny tekst dla "${key}"?`)) return;
    btn.disabled = true;
    try {
      await apiFetch(`/api/admin/ui-texts/${key}/reset`, { method: 'POST' });
      _showToast('Przywrócono oryginał.', 'success');
      await _loadSysTeksty();
    } catch(e) {
      _showToast(e.message || 'Błąd.', 'error');
      btn.disabled = false;
    }
  }

  // ── Mechanics ────────────────────────────────────────────
  async function mechPatchEdit(cell, patchUrl, field) {
    const orig = cell.textContent.trim();
    const input = document.createElement('input');
    input.className = 'inline-input';
    input.value = orig === '—' ? '' : orig;
    cell.textContent = '';
    cell.appendChild(input);
    input.focus();
    const save = async () => {
      const val = input.value.trim();
      if (val === orig || (val === '' && orig === '—')) { cell.textContent = orig; return; }
      try {
        await apiFetch(patchUrl, { method: 'PATCH', body: JSON.stringify({ [field]: val || null }) });
        cell.textContent = val || '—';
        showToast('Zapisano.', 'success');
      } catch(e) { cell.textContent = orig; showToast('Błąd: ' + e.message, 'error'); }
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();save();} if(e.key==='Escape'){cell.textContent=orig;} });
  }

  async function _mcpApiFetch(path, options = {}) {
    const token = localStorage.getItem('aigm_admin_token') || '';
    const headers = new Headers(options.headers || {});
    if (!headers.has('Content-Type') && options.body) headers.set('Content-Type', 'application/json');
    if (token) headers.set('Authorization', `Bearer ${token}`);
    const resp = await fetch(`/api${path}`, { ...options, headers });
    let body = null;
    try { body = await resp.json(); } catch { /* non-json */ }
    if (!resp.ok) {
      const msg = body?.detail || `HTTP ${resp.status}`;
      throw new Error(String(msg).slice(0, 200));
    }
    return body;
  }

  async function _mcpInitConfig() {
    const userSel  = document.getElementById('mcp-cfg-user');
    const heroSel  = document.getElementById('mcp-cfg-hero');
    const campDisp = document.getElementById('mcp-cfg-camp-display');
    const saveBtn  = document.getElementById('mcp-cfg-save');
    const statusEl = document.getElementById('mcp-cfg-status');
    let _heroMap = {}, _pinnedHeroId = null;

    try {
      const cfg = await _mcpApiFetch('/admin/mcp/config');
      _pinnedHeroId = cfg.hero_id ?? null;
      if (statusEl) statusEl.textContent = cfg.hero_name
        ? `Aktywna: bohater „${cfg.hero_name}" → kampania „${cfg.campaign_title ?? '—'}"`
        : 'Brak przypietej sesji — MCP używa auto-wykrywania.';
    } catch(e) { if (statusEl) statusEl.textContent = `Błąd ładowania: ${e.message}`; }

    const updateCampDisplay = () => {
      const hero = _heroMap[heroSel?.value];
      if (campDisp) campDisp.textContent = hero?.campaign_id ? `#${hero.campaign_id} ${hero.campaign_title||''}`.trim() : '—';
      if (saveBtn) saveBtn.disabled = false;
    };

    const populateHeroes = async (userId) => {
      if (!heroSel) return;
      heroSel.innerHTML = `<option value="">— brak (auto) —</option>`;
      heroSel.disabled = true; if (campDisp) campDisp.textContent = '—'; if (saveBtn) saveBtn.disabled = true;
      if (!_mcpDemoToken) return;
      try {
        const url = userId ? `/api/characters?user_id=${userId}` : `/api/characters`;
        const resp = await fetch(url, { headers:{'Authorization':`Bearer ${_mcpDemoToken}`} });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const heroes = data.heroes || (Array.isArray(data) ? data : []);
        _heroMap = {};
        heroes.forEach(h => {
          _heroMap[String(h.id)] = h;
          const opt = document.createElement('option');
          opt.value = String(h.id);
          opt.textContent = `${h.name}  (${h.campaign_title || `kampania #${h.campaign_id}` || 'brak kampanii'})`;
          heroSel.appendChild(opt);
        });
        heroSel.disabled = false; if (saveBtn) saveBtn.disabled = false;
        if (_pinnedHeroId && _heroMap[String(_pinnedHeroId)]) {
          heroSel.value = String(_pinnedHeroId); updateCampDisplay();
          const uid = _heroMap[String(_pinnedHeroId)]?.user_id;
          if (uid && userSel) userSel.value = String(uid);
        }
      } catch(e) { heroSel.innerHTML = `<option value="">⚠ ${e.message}</option>`; heroSel.disabled = false; if (saveBtn) saveBtn.disabled = false; }
    };

    const populateUsers = async () => {
      let waited = 0;
      const waitAndLoad = () => { if (_mcpDemoToken || waited >= 3000) _doPopulate(); else { waited += 150; setTimeout(waitAndLoad, 150); } };
      const _doPopulate = async () => {
        try {
          const resp = await fetch('/api/characters', { headers:{'Authorization':`Bearer ${_mcpDemoToken}`} });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const heroes = data.heroes || (Array.isArray(data) ? data : []);
          const seen = new Map();
          heroes.forEach(h => { if (h.user_id && !seen.has(h.user_id)) seen.set(h.user_id, h.user_id); });
          if (userSel) {
            userSel.innerHTML = `<option value="">— wszyscy gracze —</option>`;
            seen.forEach(uid => { const opt=document.createElement('option'); opt.value=String(uid); opt.textContent=`Gracz #${uid}`; userSel.appendChild(opt); });
            userSel.disabled = false;
          }
          populateHeroes(null);
        } catch(e) { if (userSel) { userSel.innerHTML = `<option value="">⚠ ${e.message}</option>`; userSel.disabled = false; } populateHeroes(null); }
      };
      waitAndLoad();
    };

    userSel?.addEventListener('change', () => { _pinnedHeroId = null; populateHeroes(userSel.value ? parseInt(userSel.value) : null); });
    heroSel?.addEventListener('change', updateCampDisplay);
    saveBtn?.addEventListener('click', async () => {
      saveBtn.disabled = true; saveBtn.textContent = 'Zapisywanie…';
      const hero = _heroMap[heroSel?.value] ?? null;
      const heroId = hero ? parseInt(heroSel.value) : null;
      const campId = hero?.campaign_id ?? null;
      try {
        await _mcpApiFetch('/admin/mcp/config', { method:'PUT', body:JSON.stringify({campaign_id:campId,hero_id:heroId}) });
        if (statusEl) statusEl.textContent = hero ? `Aktywna: bohater „${hero.name}" → kampania „${hero.campaign_title||campId}"` : 'Brak przypietej sesji.';
        _showToast('Konfiguracja MCP zapisana', 'success');
        if (campId) { const sel=document.getElementById('mcp-camp-sel'); if (sel) { sel.value=String(campId); _mcpLoadSelectedCampaign(); } }
      } catch(e) { _showToast(`Błąd zapisu: ${e.message}`, 'error'); }
      finally { saveBtn.disabled = false; saveBtn.textContent = 'Zapisz'; }
    });
    populateUsers();
  }

  async function _mcpInitDemoCampaigns() {
    const sel = document.getElementById('mcp-camp-sel');
    try {
      const loginResp = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:'demo', password:'demo'}),
      });
      if (!loginResp.ok) throw new Error(`Login failed ${loginResp.status}`);
      const auth = await loginResp.json();
      _mcpDemoToken = auth.access_token;
      localStorage.setItem('token', auth.access_token);
      localStorage.setItem('aigm_access_token', auth.access_token);
      if (auth.refresh_token) localStorage.setItem('aigm_refresh_token', auth.refresh_token);
      localStorage.setItem('user', JSON.stringify({id:auth.user_id,username:auth.username,display_name:auth.display_name,is_admin:auth.is_admin}));
      const campsResp = await fetch('/api/campaigns', { headers:{'Authorization':`Bearer ${_mcpDemoToken}`} });
      if (!campsResp.ok) throw new Error('Brak dostępu do kampanii');
      const campsData = await campsResp.json();
      const all = (campsData.campaigns || (Array.isArray(campsData) ? campsData : [])).sort((a,b) => (b.id??0)-(a.id??0));
      _mcpDemoCamps = all;
      if (sel) {
        sel.innerHTML = '';
        const active = all.filter(c => c.status === 'active'), ended = all.filter(c => c.status !== 'active');
        if (active.length) { const g=document.createElement('optgroup'); g.label='Aktywne'; active.forEach(c => { const o=document.createElement('option'); o.value=c.id; o.textContent=`#${c.id} ${c.title||'Kampania'}`; g.appendChild(o); }); sel.appendChild(g); }
        if (ended.length)  { const g=document.createElement('optgroup'); g.label='Zakończone'; ended.forEach(c => { const o=document.createElement('option'); o.value=c.id; o.textContent=`#${c.id} ${c.title||'Kampania'}`; g.appendChild(o); }); sel.appendChild(g); }
        if (!all.length) sel.innerHTML = `<option value="">Brak kampanii</option>`;
        sel.disabled = false;
        if (active.length) sel.value = String(active[0].id); else if (all.length) sel.value = String(all[0].id);
        _mcpLoadSelectedCampaign();
      }
    } catch(e) { if (sel) { sel.disabled = false; sel.innerHTML = `<option value="">⚠ ${e.message}</option>`; } }
  }

  function _mcpLoadSelectedCampaign() {
    const sel = document.getElementById('mcp-camp-sel');
    const iframe = document.getElementById('mcp-player-iframe');
    const diagBar = document.getElementById('mcp-diag-bar');
    if (!iframe) return;
    const campId = sel?.value;
    if (!campId) return;
    const camp = _mcpDemoCamps.find(c => String(c.id) === String(campId));
    if (camp?.character_id) localStorage.setItem('aigm_hero_id', String(camp.character_id));
    localStorage.setItem('aigm_campaign_id', String(campId));
    if (diagBar) { diagBar.textContent = '⏳ Ładowanie…'; diagBar.hidden = false; }
    iframe.addEventListener('load', function _onLoad() {
      iframe.removeEventListener('load', _onLoad);
      setTimeout(() => {
        try {
          const doc = iframe.contentDocument;
          if (!doc) { if (diagBar) { diagBar.textContent = '⚠ brak dostępu do iframe (cross-origin?)'; diagBar.hidden = false; } return; }
          const active = doc.querySelector('.screen--active');
          const screenId = active?.id || 'none';
          const heroName = doc.getElementById('character-name-display')?.textContent?.trim() || '—';
          const msgCount = doc.getElementById('chat-messages')?.childElementCount ?? 0;
          if (diagBar) { diagBar.textContent = `Ekran: ${screenId} | Bohater: ${heroName} | Wiad: ${msgCount}`; diagBar.hidden = false; }
        } catch(e) { if (diagBar) { diagBar.textContent = `⚠ Błąd iframe: ${e.message}`; diagBar.hidden = false; } }
      }, 2500);
    });
    iframe.src = '/?_t=' + Date.now();
  }

  async function saveKnowledge(existingKey, btn) {
    const g = id => document.getElementById(id);
    const title = g('kn-title')?.value?.trim();
    if (!title) { _showToast('Wypełnij tytuł.', 'error'); return; }
    const key = existingKey || g('kn-key')?.value?.trim();
    if (!key) { _showToast('Wypełnij klucz.', 'error'); return; }
    const body = { tip_key: key, title, body: g('kn-body')?.value?.trim()||'', category: g('kn-cat')?.value||'general', sort_order: parseInt(g('kn-order')?.value)||0, is_active: g('kn-active')?.checked??true };
    btn.disabled = true; btn.textContent = '⏳';

  async function _refreshInviteTree() {

      return;
    }

    if (!treeData || (Array.isArray(treeData) && !treeData.length)) {

      if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:60px;color:var(--t3)">Brak danych drzewa zaproszeń.</div>';
      return;
    }
    const rootData = Array.isArray(treeData)

      : treeData;
    _drawInviteTree(rootData);

  function _drawInviteTree(rootData) {
    const d3 = window.d3;
    const wrap = document.getElementById('invite-tree-svg-wrap');
    if (!wrap) return;
    const svgEl = document.getElementById('invite-tree-svg');
    if (svgEl) svgEl.innerHTML = '';
    const activityColor = { active:'#4caf78', low:'#c9944a', cold:'#6b665e' };
    const margin = { top:24, right:140, bottom:24, left:100 };
    const dx = 44, dy = 180;
    const root = d3.hierarchy(rootData);
    root.descendants().forEach(d => { if (d.depth > 1) { d._children = d.children; d.children = null; } });
    const tree = d3.tree().nodeSize([dx, dy]);
    const svg = d3.select('#invite-tree-svg');
    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const linkGen = d3.linkHorizontal().x(d => d.y).y(d => d.x);
    const gLinks = g.append('g').attr('fill','none').attr('stroke','#3a3d50').attr('stroke-width',1.5);
    const gNodes = g.append('g').attr('cursor','pointer');
    function update(source) {
      tree(root);
      let x0 = Infinity, x1 = -Infinity;
      root.each(d => { if (d.x > x1) x1 = d.x; if (d.x < x0) x0 = d.x; });
      const height = x1 - x0 + margin.top + margin.bottom + dx*2;
      const width  = root.height * dy + margin.left + margin.right + 60;
      svg.attr('width', Math.max(width,400)).attr('height', Math.max(height,200));
      g.attr('transform', `translate(${margin.left},${margin.top + (-x0 + dx)})`);
      const links = gLinks.selectAll('path').data(root.links(), d => d.target.data.id);
      links.enter().append('path').attr('opacity',0)
        .attr('d', () => { const o={x:source.x0??source.x,y:source.y0??source.y}; return linkGen({source:o,target:o}); })
        .merge(links).transition().duration(250).attr('opacity',1).attr('d',linkGen);
      links.exit().transition().duration(250).attr('opacity',0)
        .attr('d', () => { const o={x:source.x,y:source.y}; return linkGen({source:o,target:o}); }).remove();
      const nodes = gNodes.selectAll('g.inv-node').data(root.descendants(), d => d.data.id);
      const nodeEnter = nodes.enter().append('g').attr('class','inv-node')
        .attr('transform', () => `translate(${source.y0??source.y},${source.x0??source.x})`).attr('opacity',0)
        .on('click', (event, d) => {
          if (d._children || d.children) {
            if (d.children) { d._children = d.children; d.children = null; } else { d.children = d._children; d._children = null; }
            update(d);
          }
        });
      nodeEnter.append('circle').attr('r',10).attr('fill','transparent')
        .attr('stroke', d => activityColor[d.data.status]||'#6b665e')
        .attr('stroke-width', d => d._children ? 2 : 0).attr('stroke-dasharray','3,2');
      nodeEnter.append('circle').attr('class','inv-node-circle').attr('r',6)
        .attr('fill', d => activityColor[d.data.status]||'#6b665e').attr('stroke','#0f1117').attr('stroke-width',1.5);
      nodeEnter.append('text').attr('class','inv-node-label').attr('dy','0.32em')
        .attr('x', d => (d.children||d._children) ? -14 : 14)
        .attr('text-anchor', d => (d.children||d._children) ? 'end' : 'start')
        .attr('fill','#c9a54a').attr('font-size','12px').text(d => d.data.name||d.data.username);
      nodeEnter.append('text').attr('class','inv-node-turns').attr('dy','0.32em').attr('y',-13)
        .attr('text-anchor','middle').attr('fill', d => activityColor[d.data.status]||'#6b665e')
        .attr('font-size','10px').text(d => d.data.turns > 0 ? `${d.data.turns}t` : '');
      const nodeMerge = nodeEnter.merge(nodes);
      nodeMerge.transition().duration(250).attr('transform', d => `translate(${d.y},${d.x})`).attr('opacity',1);
      nodeMerge.select('circle.inv-node-circle').attr('fill', d => activityColor[d.data.status]||'#6b665e');
      nodeMerge.select('circle:first-child').attr('stroke-width', d => d._children ? 2 : 0);
      nodeMerge.select('text.inv-node-label')
        .attr('x', d => (d.children||d._children) ? -14 : 14)
        .attr('text-anchor', d => (d.children||d._children) ? 'end' : 'start');
      nodes.exit().transition().duration(250).attr('transform', () => `translate(${source.y},${source.x})`).attr('opacity',0).remove();
      root.each(d => { d.x0 = d.x; d.y0 = d.y; });
    }
    root.x0 = 0; root.y0 = 0; update(root);
  }

  async function createInvite(btn) {

    const max_uses = parseInt(document.getElementById('inv-max-uses')?.value ?? '1', 10);
    btn.disabled = true; btn.textContent = '⏳';
    try {
      const d = await apiFetch('/api/admin/invites', { method: 'POST', body: JSON.stringify({ email, message, max_uses }) });
      // Build full link — backend may return relative path if APP_BASE_URL not set
      const rawLink = d.invite_link || '';
      _invCurrentLink = rawLink.startsWith('http') ? rawLink : `${_INV_BASE_URL}${rawLink}`;
      _invLastCode = d.code || '';
      _invLastEmail = email || '';

      const linkEl = document.getElementById('inv-link');
      const resultEl = document.getElementById('inv-result');
      const fullMsgEl = document.getElementById('inv-full-msg');
      const msgEl = document.getElementById('inv-msg');
      const sendBtn = document.getElementById('inv-send-email-btn');

      if (linkEl) linkEl.textContent = _invCurrentLink;

      // Build full message: replace [LINK] placeholder or append link
      const msgRaw = msgEl?.value?.trim() || '';
      const fullMsg = msgRaw
        ? (msgRaw.includes('[LINK]') ? msgRaw.replace('[LINK]', _invCurrentLink) : msgRaw + '\n\n' + _invCurrentLink)
        : _invCurrentLink;
      if (fullMsgEl) fullMsgEl.textContent = fullMsg;

      // Update textarea to show final message with real link
      if (msgEl && msgRaw.includes('[LINK]')) msgEl.value = msgRaw.replace('[LINK]', _invCurrentLink);

      // Show send button only when email is provided; reset state
      if (sendBtn) {
        sendBtn.style.display = email ? '' : 'none';
        sendBtn.disabled = false;
        sendBtn.textContent = '📧 Wyślij e-mail';

  async function _runPlaywrightSpec(filename, btn) {
    const logEl = document.getElementById('pw-log');
    const statusEl = document.getElementById('pw-status');
    if (!logEl) return;
    if (btn) { btn.disabled = true; }
    logEl.innerHTML = `<span style="color:var(--t3)">Uruchamianie: ${_esc(filename || 'wszystkie')} …</span>`;
    if (statusEl) { statusEl.textContent = '⏳ Running…'; statusEl.style.color = 'var(--t3)'; }

    const append = (line, isErr = false) => {
      const el = document.createElement('div');
      el.style.cssText = `white-space:pre-wrap;color:${isErr ? '#f88' : 'var(--t2)'}`;
      el.textContent = line;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
    };

    const tok = localStorage.getItem('aigm_admin_token') || '';
    try {
      const resp = await fetch('/api/test_runner/playwright-run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tok}` },
        body: JSON.stringify({ spec: filename }),
      });
      if (!resp.ok) { throw new Error(`HTTP ${resp.status}`); }

      logEl.innerHTML = '';
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let done = false;
      let success = false;

      while (!done) {
        const { value, done: d } = await reader.read();
        done = d;
        if (value) buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const obj = JSON.parse(line.slice(6));
            if (obj.type === 'log') append(obj.line, obj.isErr);
            else if (obj.type === 'done') { success = obj.success; done = true; }
          } catch (_) { /* parse error */ }
        }
      }

      if (statusEl) {
        statusEl.textContent = success ? '✓ Passed' : '✗ Failed';
        statusEl.style.color = success ? '#4c8' : '#e55';
      }
      _showToast(success ? 'Testy przeszły ✓' : 'Testy nie przeszły ✗', success ? 'success' : 'error');
    } catch(e) {
      append(`Błąd: ${e.message}`, true);
      if (statusEl) { statusEl.textContent = '✗ Error'; statusEl.style.color = '#e55'; }
      _showToast(e.message, 'error');
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = btn.id === 'pw-run-all' ? '▶ Uruchom wszystkie' : '▶';
      }
    }
  }

        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--t3)"><div style="font-size:32px;margin-bottom:8px;opacity:0.25">🖼</div><div style="font-size:0.8rem">Brak wygenerowanych obrazów</div></div>';

      grid.innerHTML = imgs.map(img => `
        <div class="img-thumb-card" onclick="${pickMode
          ? `_imgPickAsRef('${img.filename}','${img.url}')`

  async function imgGenerate() {
    const prompt = document.getElementById('img-prompt').value.trim();
    if (!prompt) { _showToast('Wpisz opis obrazu.', 'warn'); return; }

    const sizeVal = document.getElementById('img-size').value;
    const [w, h] = sizeVal.split('x').map(Number);
    const steps = parseInt(document.getElementById('img-steps').value);
    const denoiseEl = document.getElementById('img-ref-denoise');
    const denoise = denoiseEl ? parseInt(denoiseEl.value) / 100 : 0.6;
    const hasRef = !!(_imgRefB64 || _imgRefFilename);

    const btn = document.getElementById('img-gen-btn');
    const status = document.getElementById('img-gen-status');
    const previewArea = document.getElementById('img-preview-area');
    const promptEl = document.getElementById('img-prompt');
    const copyBtn = document.getElementById('img-copy-url-btn');
    const refineBtn = document.getElementById('img-refine-btn');

    btn.disabled = true;
    btn.innerHTML = '⏳ Generowanie…';
    promptEl.classList.add('generating');
    if (status) status.textContent = '0s…';
    if (copyBtn) copyBtn.style.display = 'none';
    if (refineBtn) refineBtn.style.display = 'none';

    const start = Date.now();
    const timer = setInterval(() => {
      if (status) status.textContent = `${Math.round((Date.now()-start)/1000)}s…`;
    }, 1000);

    previewArea.innerHTML = '<div style="text-align:center;padding:20px;color:var(--t3)"><div class="img-spinner"></div><div style="font-size:0.78rem">' + (hasRef ? 'Refinowanie obrazu…' : 'Generowanie obrazu…') + '</div></div>';

    try {
      let data;
      if (_imgRefFilename) {
        data = await apiFetch('/api/admin/images/refine', {
          method: 'POST',
          body: JSON.stringify({ source_filename: _imgRefFilename, prompt, denoise, steps })
        });
      } else if (_imgRefB64) {
        data = await apiFetch('/api/admin/images/refine-upload', {
          method: 'POST',
          body: JSON.stringify({ upload_b64: _imgRefB64, prompt, denoise, steps })
        });
      } else {
        data = await apiFetch('/api/admin/images/generate', {
          method: 'POST',
          body: JSON.stringify({ prompt, width: w, height: h, steps })
        });
      }

      _imgLastUrl = data.url;
      _imgLastFilename = data.filename;

      previewArea.innerHTML = `
        <img src="${data.url}" alt="Generated"
          style="max-width:100%;max-height:320px;border-radius:var(--r);display:block;margin:0 auto;box-shadow:var(--shadow-md);cursor:pointer"
          onclick="imgOpenLightbox('${data.url}','${data.filename}')">
      `;
      if (copyBtn) copyBtn.style.display = '';
      if (refineBtn) refineBtn.style.display = '';
      if (status) status.textContent = `${Math.round((Date.now()-start)/1000)}s`;
      _showToast(hasRef ? 'Obraz zrefinowany!' : 'Obraz wygenerowany!', 'success');
      _loadImgGallery();
    } catch(e) {
      previewArea.innerHTML = `<div style="color:var(--red);font-size:0.8rem;text-align:center;padding:20px">Błąd: ${e.message}</div>`;
      if (status) status.textContent = 'błąd';
      _showToast('Błąd: ' + e.message, 'error');
    } finally {
      clearInterval(timer);
      btn.disabled = false;
      btn.innerHTML = (_imgRefB64 || _imgRefFilename) ? '🔄 Refined Generuj' : '🎨 Generuj';
      promptEl.classList.remove('generating');
    }
  }

  async function _loadPush() {

    if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--t3)">Ładowanie…</td></tr>`;

      document.getElementById('push-total').textContent = total;
      document.getElementById('push-subscribed').textContent = subscribed;
      document.getElementById('push-unsubscribed').textContent = total - subscribed;
      document.getElementById('push-sub').textContent = `${subscribed} z ${total} graczy ma aktywne powiadomienia`;

      // populate select
      const sel = document.getElementById('push-target-user');
      if (sel) {
        sel.innerHTML = '<option value="">— wybierz gracza —</option>' +
          _pushData.map(r => `<option value="${r.user_id}">[${r.subscription_count > 0 ? '✅' : '⬜'}] ${r.username}${r.display_name ? ' — '+r.display_name : ''}</option>`).join('');
      }

      if (tbody) {
        tbody.innerHTML = _pushData.map(r => {
          const hasSub = r.subscription_count > 0;
          const statusBadge = hasSub
            ? `<span style="color:var(--green,#4caf50);font-weight:600">✅ Aktywna</span>`
            : `<span style="color:var(--t3)">⬜ Brak</span>`;
          const lastSub = r.last_subscribed_at ? new Date(r.last_subscribed_at).toLocaleString('pl-PL') : '—';
          return `<tr>
            <td><b>${r.username}</b>${r.display_name ? '<br><span style="color:var(--t3);font-size:12px">'+r.display_name+'</span>' : ''}</td>
            <td>${statusBadge}</td>
            <td style="text-align:center">${r.subscription_count}</td>
            <td style="font-size:12px;color:var(--t3)">${lastSub}</td>
            <td style="display:flex;gap:6px;align-items:center">
              ${hasSub ? `<button class="btn btn-secondary btn-sm" onclick="_quickTestPush(${r.user_id},'${r.username}')">🔔 Test</button>` : '<span style="color:var(--t3);font-size:12px">—</span>'}
              ${hasSub ? `<button class="btn btn-sm" style="background:rgba(229,57,53,.12);border:1px solid rgba(229,57,53,.3);color:var(--red,#e53935)" onclick="_revokePushSubscription(${r.user_id},'${r.username}')" title="Usuń subskrypcję — gracz będzie pytany o zgodę ponownie">✕ Usuń</button>` : ''}
            </td>
          </tr>`;
        }).join('') || `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--t3)">Brak użytkowników</td></tr>`;

      if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--red)">Błąd: ${e.message}</td></tr>`;
    }
  }

  async function _sendTestPush() {
    const userId = parseInt(document.getElementById('push-target-user').value);
    if (!userId) { alert('Wybierz gracza'); return; }
    const title = document.getElementById('push-test-title').value.trim() || 'AI-GM — test powiadomienia';
    const body = document.getElementById('push-test-body').value.trim() || 'Push notifications działają!';
    const icon = document.getElementById('push-test-icon').value.trim() || null;
    const image = document.getElementById('push-test-image').value.trim() || null;
    const vibrateRaw = document.getElementById('push-test-vibrate').value.trim();
    const vibrate = vibrateRaw ? vibrateRaw.split(',').map(v => parseInt(v.trim())).filter(n => !isNaN(n)) : null;
    const url = document.getElementById('push-test-url').value.trim() || '/';
    const resultEl = document.getElementById('push-test-result');
    resultEl.style.display = 'none';
    const payload = { user_id: userId, title, body, url };
    if (icon) payload.icon = icon;
    if (image) payload.image = image;
    if (vibrate && vibrate.length) payload.vibrate = vibrate;
    try {
      await apiFetch('/api/admin/push/send-test', { method:'POST', body: JSON.stringify(payload) });
      resultEl.style.display = 'block';
      resultEl.style.color = 'var(--green,#4caf50)';
      resultEl.textContent = '✅ Powiadomienie wysłane! Sprawdź urządzenie gracza.';
    } catch(e) {
      resultEl.style.display = 'block';
      resultEl.style.color = 'var(--red,#e53935)';
      resultEl.textContent = '❌ Błąd: ' + e.message;

      const gh = document.getElementById('br-github');
      const loc = document.getElementById('br-local');
      const sub = document.getElementById('br-sub');

  // ── Hash-based routing — persist section + subtab across F5 ────────────────
  // Format: #section  or  #section/subtab
  const _SUBTAB_ATTRS = {
    content:   ['#content-tabs',   'data-tab'],
    world:     ['#world-tabs',     'data-wtab'],
    map:       ['#map-tabs',       'data-mtap'],

    system:    ['#sys-stab-bar',   'data-systab'],
  };

  function _updateHash(section, subtab) {
    const hash = subtab ? `#${section}/${subtab}` : `#${section}`;
    history.replaceState(null, '', hash);
  }

  // Patch switchSection to write section into hash
  const _origSwitchSection = switchSection;
  // eslint-disable-next-line no-func-assign
  switchSection = function(key) {
    _origSwitchSection(key);
    // Preserve existing subtab in hash if same section
    const cur = location.hash.slice(1).split('/');
    if (cur[0] === key && cur[1]) {
      _updateHash(key, cur[1]);
    } else {
      _updateHash(key);
    }
  };

  // Patch each subtab container to write subtab into hash on click
  (function _patchSubtabHashes() {
    const patches = [
      { sel: '#content-tabs',  attr: 'data-tab',    section: 'content'   },
      { sel: '#world-tabs',    attr: 'data-wtab',   section: 'world'     },
      { sel: '#map-tabs',      attr: 'data-mtap',   section: 'map'       },

      { sel: '#sys-stab-bar',  attr: 'data-systab', section: 'system'    },
    ];
    patches.forEach(({ sel, attr, section }) => {
      document.querySelector(sel)?.addEventListener('click', e => {
        const btn = e.target.closest(`.stab[${attr}]`);
        if (btn) _updateHash(section, btn.getAttribute(attr));
      }, true); // capture so it fires before other handlers
    });
  })();

  function _applyHash() {
    const raw = location.hash.slice(1);
    if (!raw) return;
    const [section, subtab] = raw.split('/');
    if (!section) return;
    _origSwitchSection(section); // use original to avoid re-writing hash
    if (subtab) {
      const entry = _SUBTAB_ATTRS[section];
      if (entry) {
        const [containerId, attr] = entry;
        const btn = document.querySelector(`${containerId} .stab[${attr}="${subtab}"]`);
        if (btn) btn.click();
      }
    }
  }

  window.addEventListener('hashchange', _applyHash);
  // Apply on load after all handlers registered
  requestAnimationFrame(_applyHash);
  // FADM-P1 (#403): overview przeniesione do /admin/. Bez hasha -> domyslnie players.
  requestAnimationFrame(() => {
    const sec = (location.hash.slice(1).split('/')[0]) || '';
    if (!sec) switchSection('players');
  });
