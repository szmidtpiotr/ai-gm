services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/healthz', timeout=5).read()",
        ]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
    ports:
      - "8000:8000"
    environment:
      # #1090 — JWT secret must survive rebuilds; pass from .env to container
      - JWT_SECRET=${JWT_SECRET:-}
      - OLLAMA_LOAD_TIMEOUT=300s
      - OLLAMA_TIMEOUT=240
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-gemma4:e4b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEFAULT_CAMPAIGN_LANGUAGE=${DEFAULT_CAMPAIGN_LANGUAGE:-pl}
      - GAME_LANG=${GAME_LANG:-pl-PL}
      # #866 — public base URL for email links (invite / verify / reset).
      # Without it invite_link is relative → mail clients render http:///register (empty host).
      - APP_BASE_URL=${APP_BASE_URL:-https://aigm.studio-colorbox.com}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/ai_gm.db}
      - ADMIN_IMPORT_BACKUP_DIR=${ADMIN_IMPORT_BACKUP_DIR:-/backups/imports}
      # Telegram bot — turn notifications + easy-click linking (#602/#883). Bot now
      # lives on PROD (repointed from DEV); values injected from .env, never committed.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # #1378 — ops alert (LLM budget exhausted etc.), independent of player prefs.
      - ADMIN_ALERT_TELEGRAM_CHAT_ID=${ADMIN_ALERT_TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./backups:/backups
    labels:
      - service=backend
    networks:
      - ai-gm

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ai-gm

networks:
  ai-gm:
    driver: bridge
