services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/healthz', timeout=5).read()",
        ]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_LOAD_TIMEOUT=300s
      - OLLAMA_TIMEOUT=240
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-gemma4:e4b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEFAULT_CAMPAIGN_LANGUAGE=${DEFAULT_CAMPAIGN_LANGUAGE:-pl}
      - GAME_LANG=${GAME_LANG:-pl-PL}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/ai_gm.db}
      - ADMIN_IMPORT_BACKUP_DIR=${ADMIN_IMPORT_BACKUP_DIR:-/backups/imports}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./backups:/backups
    labels:
      - service=backend
    networks:
      - ai-gm

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ai-gm

  voice-service:
    build:
      context: ./voice-service
    container_name: ai-gm-voice
    restart: unless-stopped
    environment:
      - VOICE_CONFIG_PATH=/app/config.json
      - VOICE_MODELS_DIR=/app/models/tts
      - VOICE_MODELS_DIR_STT=/app/models/stt
      - PIPER_BIN=/opt/piper/piper
    ports:
      - "8300:8300"
    volumes:
      - ./voice-service/models:/app/models
      - ./voice-service/config.json:/app/config.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8300/voice/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - ai-gm

networks:
  ai-gm:
    driver: bridge
