<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-GM · Mapa architektury — Turn Flow + LLM Seam</title>
<style>
  :root{
    --bg:#0F0F0F; --panel:#161616; --panel-2:#1c1c1c; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#8a8a8a;
    --client:#4ea1ff; --route:#7bd389; --service:#c792ea; --db:#ffb86b;
    --external:#ff6b9d; --critical:#ff3860; --accent:#f5b942; --accent-2:#ff7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden}
  #topbar{position:absolute;top:10px;left:10px;right:auto;max-width:calc(100vw - 360px);z-index:5;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;background:rgba(20,20,20,.96);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #topbar h1{font-size:13px;margin:0 12px 0 0;font-weight:600;letter-spacing:.3px;white-space:nowrap;
    cursor:move;user-select:none}
  #topbar h1:active{cursor:grabbing}
  #topbar h1 .grip{color:var(--accent);margin-right:6px;font-size:14px}
  #topbar h1 span{color:var(--muted);font-weight:400}
  .chip{padding:4px 10px;border:1px solid var(--border);border-radius:14px;background:var(--panel-2);
    color:var(--muted);cursor:pointer;user-select:none;font-size:12px;transition:.12s}
  .chip:hover{color:var(--text);border-color:#3a3a3a}
  .chip.active{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
  .chip.crit.active{background:var(--critical);color:#fff;border-color:var(--critical)}
  .zoombtns{margin-left:auto;display:flex;gap:6px}
  .zoombtns button{width:28px;height:28px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);border-radius:6px;cursor:pointer;font-size:14px}
  .zoombtns button:hover{border-color:#3a3a3a}
  #canvas{flex:1;position:relative;overflow:hidden;cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  svg{position:absolute;top:0;left:0;width:100%;height:100%}
  #scene{transition:none}
  .cluster rect{fill-opacity:.10;stroke-opacity:.45;stroke-width:1}
  .cluster text{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;fill:var(--muted)}
  .node{cursor:pointer}
  .node rect{fill:var(--panel);stroke-width:1.4;rx:7;transition:opacity .12s}
  .node .lbl{font-size:12px;font-weight:600;fill:var(--text)}
  .node .sub{font-size:10.5px;fill:var(--muted)}
  .node.crit rect{stroke-width:2.4}
  .node.dead rect{stroke-dasharray:4 3;fill:#141014}
  .node.dimmed{opacity:.16}
  .edge{fill:none;stroke-width:1.4;opacity:.55}
  .edge.dimmed{opacity:.05}
  .edge.hot{stroke-width:2.6;opacity:.9}
  .elabel{font-size:9.5px;fill:var(--muted);opacity:.8}
  .elabel.dimmed{opacity:.04}
  .badge-fix{fill:var(--route)}
  .badge-bug{fill:var(--critical)}
  .badge text{font-size:9px;font-weight:700;fill:#0c0c0c}
  #sidebar{width:340px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:16px 16px 40px;z-index:6}
  #sidebar h2{font-size:14px;margin:0 0 2px}
  #sidebar .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--accent);word-break:break-all;margin-bottom:10px}
  #sidebar .role{font-size:12.5px;margin:8px 0}
  #sidebar .plain{font-size:12.5px;color:#cfcfcf;background:var(--panel-2);border-left:2px solid var(--service);
    padding:8px 10px;border-radius:4px;margin:8px 0}
  #sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
  #sidebar ul{margin:4px 0;padding-left:16px}
  #sidebar li{margin:3px 0;font-size:12px;color:#cfcfcf}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin:2px 4px 2px 0;
    border:1px solid var(--border);color:var(--muted)}
  .edgeline{font-size:11.5px;margin:3px 0;color:#cfcfcf}
  .edgeline b{color:var(--text);font-weight:600}
  .arrow{color:var(--muted)}
  .bug{font-size:11.5px;margin:4px 0;padding:5px 8px;border-radius:4px;background:#241317;border-left:2px solid var(--critical)}
  .bug .sev{font-weight:700;text-transform:uppercase;font-size:9px;color:var(--critical)}
  .fix{font-size:11.5px;margin:4px 0;padding:5px 8px;border-radius:4px;background:#142117;border-left:2px solid var(--route)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
  .legend i{width:18px;height:0;border-top:2px solid;display:inline-block}
  .muted{color:var(--muted)}
  .heatnote{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
  #overlaystate{font-size:10.5px;color:var(--muted);padding:2px 8px;border:1px dashed var(--border);border-radius:10px}
  .task{cursor:pointer;transition:.1s}
  .task:hover{filter:brightness(1.35)}
  #pop{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6)}
  #pop.show{display:block}
  #popbox{position:fixed;left:0;top:0;width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:0 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #pophead{display:flex;align-items:flex-start;gap:10px;cursor:move;user-select:none;
    background:var(--panel-2);margin:0 -22px 12px;padding:12px 16px 12px 14px;
    border-radius:12px 12px 0 0;border-bottom:1px solid var(--accent)}
  #pophead:active{cursor:grabbing}
  #pophead .grip{color:var(--accent);font-size:18px;line-height:1.3;flex:0 0 auto}
  #pophead .htext{flex:1;min-width:0}
  #popclose{background:none;border:0;color:var(--muted);font-size:24px;line-height:.8;cursor:pointer;
    padding:0 2px;flex:0 0 auto}
  #popclose:hover{color:var(--text)}
  #popbox .num{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent);font-weight:700}
  #popbox .num::after{content:" · przeciągnij za ten pasek";color:var(--muted);font-weight:400;font-size:10.5px}
  #popbox h2#poptitle{font-size:16px;margin:4px 0 0;color:var(--text);font-weight:600;line-height:1.3}
  #popbox .meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #popbox .meta .lbl{border:1px solid var(--border);border-radius:10px;padding:1px 7px}
  #popbody{overflow-y:auto;flex:1;border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px;
    font-size:12.5px;line-height:1.55;color:#d6d6d6}
  #popbody h3{font-size:13.5px;color:var(--accent);margin:14px 0 4px;border:0;text-transform:none;letter-spacing:0}
  #popbody h4{font-size:12.5px;color:#cfcfcf;margin:10px 0 3px}
  #popbody pre.code{background:#0c0c0c;border:1px solid var(--border);border-radius:6px;padding:8px 10px;
    overflow-x:auto;font-family:ui-monospace,monospace;font-size:11.5px;color:#cbd5b5;white-space:pre}
  #popbody code{background:#0c0c0c;border:1px solid var(--border);border-radius:4px;padding:0 4px;
    font-family:ui-monospace,monospace;font-size:11.5px;color:#e0c98a}
  #popbody .li{margin:2px 0 2px 6px}
  #popbody .li.done{color:var(--route)}
  #popbody a{color:var(--client)}
  #popbody .cmt{border-left:2px solid var(--service);background:var(--panel-2);padding:8px 12px;
    border-radius:4px;margin:10px 0}
  #popbody .cmt .who{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:5px}
  #popbody .loading{color:var(--muted);font-style:italic}
  #popbox .actions{display:flex;gap:10px;justify-content:flex-end}
  #popbox a.btn,#popbox button.btn{font-size:12.5px;padding:7px 14px;border-radius:7px;cursor:pointer;
    text-decoration:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text)}
  #popbox a.btn{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="canvas">
    <div id="topbar">
      <h1 title="Przeciągnij, by przesunąć panel filtrów"><span class="grip">⠿</span>AI-GM <span>· mapa architektury · Turn Flow + LLM Seam</span></h1>
      <div id="chips"></div>
      <span id="overlaystate">overlay: —</span>
      <div class="zoombtns">
        <button id="zfit" title="Dopasuj">⤢</button>
        <button id="zin" title="Przybliż">+</button>
        <button id="zout" title="Oddal">−</button>
      </div>
    </div>
    <svg id="svg">
      <defs>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L7,3 L0,6 Z" fill="#6a6a6a"></path>
        </marker>
        <marker id="arrcrit" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L7,3 L0,6 Z" fill="#ff3860"></path>
        </marker>
      </defs>
      <g id="scene">
        <g id="gClusters"></g>
        <g id="gEdges"></g>
        <g id="gLabels"></g>
        <g id="gNodes"></g>
      </g>
    </svg>
  </div>
  <div id="sidebar"></div>
</div>

<div id="pop" onclick="if(event.target===this)closeTask()">
  <div id="popbox">
    <div id="pophead">
      <span class="grip">⠿</span>
      <div class="htext">
        <div class="num" id="popnum"></div>
        <h2 id="poptitle"></h2>
      </div>
      <button id="popclose" onclick="closeTask()" title="Zamknij (Esc)">×</button>
    </div>
    <div class="meta" id="popmeta"></div>
    <div id="popbody"></div>
    <div class="actions">
      <button class="btn" onclick="closeTask()">Zamknij</button>
      <a class="btn" id="poplink" target="_blank" rel="noopener">Otwórz na GitHub ↗</a>
    </div>
  </div>
</div>

<script>
const COLORS = { client:'--client', route:'--route', service:'--service',
                 db:'--db', external:'--external', critical:'--critical' };
function col(kind){ return getComputedStyle(document.documentElement).getPropertyValue(COLORS[kind]||'--service').trim(); }

const clusters = [
  { id:'entry',    label:'Routes / Entry',      x:20,  y:70, w:250, h:220, color:'route' },
  { id:'pipeline', label:'Intent + Pipeline',   x:300, y:70, w:260, h:380, color:'service' },
  { id:'assembly', label:'Prompt Assembly',      x:590, y:70, w:270, h:540, color:'critical' },
  { id:'llm',      label:'LLM Provider',         x:890, y:70, w:260, h:220, color:'external' },
  { id:'post',     label:'Post-turn + Events',   x:890, y:320, w:260, h:290, color:'db' },
  { id:'storage',  label:'DB / Storage',         x:1180,y:70, w:260, h:340, color:'db' },
];

const N = (id, cluster, label, sub, x, y, w, h, color, opts={}) =>
  ({ id, cluster, label, sub, x, y, w, h, color, ...opts });

const nodes = [
  /* ---- Entry ---- */
  N('tf-turns-router','entry','api/turns.py','create_turn :3057',40,110,210,58,'route',{
    role:'Main turn endpoint. Validates hero, resolves LLM config, dispatches to intent detector and narrative pipeline.',
    plain:'The front door for every player action. Gets the text the player typed and decides what to do with it.',
    path:'backend/app/api/turns.py:3057',
    notes:['POST /campaigns/{id}/turns','Checks hero dead (423), loads LLM config','Routes to dungeon/travel/combat/narrative branches'],
    tag:['overview','critical-path','all'], critical:true }),
  N('tf-turns-stream','entry','api/turns.py','create_turn_stream :4818',40,190,210,58,'route',{
    role:'Streaming variant — same logic, response is SSE chunks instead of full JSON.',
    plain:'Same as the main endpoint but sends text one word at a time so the player sees the GM typing.',
    path:'backend/app/api/turns.py:4818',
    notes:['POST /campaigns/{id}/turns/stream','SSE chunks via generate_chat_stream','Saves assembled text after stream completes'],
    tag:['overview','all'] }),

  /* ---- Intent + Pipeline ---- */
  N('tf-intent','pipeline','intent detection','turns.py :73',320,110,220,58,'service',{
    role:'Inline heuristics deciding if the player text is an attack, travel, skill-test, or narrative request.',
    plain:'Reads what the player typed and decides: is this a fight, a move, a skill check, or just talking?',
    path:'backend/app/api/turns.py:73',
    notes:['_is_combat_class_skill:73, _player_combat_intent:241','_text_is_action_attempt:120, _is_reading_context:145','_resolve_enemy_key_from_context:257, _validate_combat_start_target:636'],
    tag:['overview','critical-path','all'], critical:true }),
  N('tf-turn-pipeline','pipeline','turn_pipeline.py','process_v2_turn :269',320,190,220,56,'service',{
    role:'V2 narrative orchestrator: loads action context, calls ContextInjector, drives travel and world state.',
    plain:'The narrative brain: prepares the full context of the scene, calls the prompt assembler, handles travel moves.',
    path:'backend/app/services/turn_pipeline.py:269',
    notes:['process_v2_turn:269, _load_action_context:589','execute_directional_travel:155, guard_travel_desync:233','_process_beat_signals:873, _auto_complete_beats_by_mechanic:888'],
    tag:['overview','critical-path','all'], critical:true }),
  N('tf-game-engine','pipeline','game_engine.py','build_narrative_messages :550',320,268,220,56,'service',{
    role:'Assembles the full messages array: system prompt, history, location context, NPC context, skill-test hints.',
    plain:'Packs everything the AI needs to know into one conversation: the rules, the location, recent history, active NPCs.',
    path:'backend/app/services/game_engine.py:550',
    notes:['build_narrative_messages:550, run_narrative_turn:831','_inject_location_llm_context:292, _inject_npc_llm_context:439','_inject_dungeon_loch_context:243, _inject_campaign_s11_context:482'],
    tag:['overview','critical-path','all'], critical:true }),
  N('tf-skill-test','pipeline','skill-test / travel','turns.py :6326 / :7086',320,346,220,54,'service',{
    role:'Resolve skill-test DC check (POST /skill-test/resolve) and hex travel (POST /travel) — branching paths from intent detection.',
    plain:'Side branches: resolve a dice roll against a difficulty, or move the hero to a new hex on the world map.',
    path:'backend/app/api/turns.py:6326',
    notes:['skill-test resolve:6326, reroll:6758','travel:7086, hex-travel:7242','Both call LLM for narrative result'],
    tag:['overview','all'] }),

  /* ---- Prompt Assembly ---- */
  N('tf-context-injector','assembly','context_injector.py','ContextInjector :85',610,110,230,60,'critical',{
    role:'THE SEAM. Assembles the final narrator prompt string: system prompt + character sheet + scene + mechanic result + GM guidelines.',
    plain:'The place where all game knowledge is packed into the final text the AI reads. This is the single point where rules meet story.',
    path:'backend/app/services/context_injector.py:85',
    notes:['ContextInjector.build:105, post_process:192','build_narrator_prompt:882 (standalone helper)','Injects mechanic_result, session_flags, action_type'],
    tag:['overview','critical-path','observability','all'], critical:true }),
  N('tf-system-prompt','assembly','system_prompt_loader.py','LOCKED mechanics contract',610,192,230,54,'service',{
    role:'Loads and caches backend/prompts/system_prompt.txt — the master rules file that locks all game mechanics.',
    plain:'The game rulebook the AI always has open. Never changes without explicit approval — it defines all stats, rolls, and DC values.',
    path:'backend/app/system_prompt_loader.py:47',
    notes:['load_system_prompt_text:47, SYSTEM_PROMPT_TEXT cached','Source: backend/prompts/system_prompt.txt','LOCKED — do not modify without explicit approval'],
    tag:['overview','all'] }),
  N('tf-gm-plan','assembly','campaign_plan_service.py','generate_v2_campaign_plan :228',610,268,230,54,'service',{
    role:'Generates and retrieves the GM plan (arcs, beats, hooks) that shapes every narrative turn.',
    plain:'The story outline the GM has for this campaign. Each narrative turn checks the plan to see what should happen next.',
    path:'backend/app/services/campaign_plan_service.py:228',
    notes:['generate_v2_campaign_plan:228, get_public_plan:386','Plan stored as JSON in campaigns.gm_plan_json','campaign_plan_runtime.py drives auto-complete of beats'],
    tag:['overview','all'] }),
  N('tf-chapter-summary','assembly','chapter_summary_service.py','schedule_chapter_summary :177',610,344,230,54,'service',{
    role:'Generates and stores a chapter summary after the session ends; injected back into context on next session.',
    plain:'After a play session, summarises what happened so the AI remembers it next time without re-reading all history.',
    path:'backend/app/services/chapter_summary_service.py:177',
    notes:['schedule_chapter_summary:177 (async, fire-and-forget)','close_campaign_with_summary:207','Injected back via _inject_campaign_s11_context:482 in game_engine'],
    tag:['overview','all'] }),
  N('tf-event-logger','assembly','event_logger.py','write_game_event :8',610,420,230,52,'db',{
    role:'Observability sink (O1). Writes game_events and llm_call_log rows. Fire-and-forget, never blocks the turn.',
    plain:'The game diary. Quietly notes every significant event (combat win, death, beat complete, LLM call) for the analytics panel.',
    path:'backend/app/services/event_logger.py:8',
    notes:['write_game_event:8, write_llm_log:48','Called by llm_service on every LLM call (O2)','OBSERVABILITY: primary Phase 11 event sink'],
    tag:['overview','observability','all'] }),
  N('tf-account-svc','assembly','account_service.py','get_user_llm_settings_full',610,494,230,50,'service',{
    role:'Resolves per-user LLM overrides (custom model, provider) merged with server default at turn start.',
    plain:'Checks if this player has their own AI model preference; if not, falls back to the server default.',
    path:'backend/app/services/account_service.py',
    notes:['get_user_llm_settings_full called turns.py:3076','User mode=custom overrides server preset','Server default via llm_service.get_effective_config'],
    tag:['overview','all'] }),

  /* ---- LLM Provider ---- */
  N('tf-llm-service','llm','llm_service.py','generate_chat :600',910,110,220,58,'external',{
    role:'Calls the configured LLM provider (Ollama/OpenAI/Azure), logs latency and errors, writes llm_call_log via event_logger.',
    plain:'The actual AI call. Sends the assembled prompt to whichever LLM is configured and waits for the response.',
    path:'backend/app/services/llm_service.py:600',
    notes:['generate_chat:600, generate_chat_stream:680','Providers: OllamaDriver/OpenAIDriver/AzureDriver','Writes write_llm_log on every call (O2)'],
    tag:['overview','critical-path','observability','all'], critical:true }),
  N('tf-llm-stream','llm','llm_service.py','generate_chat_stream :680',910,190,220,54,'external',{
    role:'SSE streaming variant — yields chunks; same provider resolution as generate_chat.',
    plain:'Same AI call but sends the answer one piece at a time for the streaming endpoint.',
    path:'backend/app/services/llm_service.py:680',
    notes:['generate_chat_stream:680','Called from create_turn_stream:4818 (turns.py)','Writes llm_call_log after stream completes'],
    tag:['overview','all'] }),

  /* ---- Post-turn ---- */
  N('tf-cue-parser','post','cue parsers','turns.py :1468',910,360,220,52,'service',{
    role:'Extracts GM cues from the LLM response: item grants, gold grants, shop opens, roll cues.',
    plain:'Reads the GM text looking for magic instructions like [GRANT_ITEM] or [OPEN_SHOP] and applies them.',
    path:'backend/app/api/turns.py:1468',
    notes:['validate_roll_cue_name:1468, parse_grant_item_cue:1483','parse_grant_gold_cue:1504, parse_open_shop_cue:1529','extract_grant_cues:1706, apply_grant_gold_to_character:1815'],
    tag:['overview','all'] }),
  N('tf-turn-log','post','log_narrative_turn_structured','turns.py :968',910,434,220,52,'db',{
    role:'Persists the completed turn (user_text + assistant_text + metadata) to campaign_turns.',
    plain:'Saves the player message and GM response to the history so they can be shown later and fed back to the AI.',
    path:'backend/app/api/turns.py:968',
    notes:['log_narrative_turn_structured:968, log_memory_turn_structured:1014','Writes to campaign_turns table','Feeds context window on next turn'],
    tag:['overview','critical-path','all'], critical:true }),

  /* ---- Storage ---- */
  N('tf-campaign-turns-db','storage','campaign_turns','table (DB)',1200,110,220,50,'db',{
    role:'Append-only log of all player+GM turns (narrative, combat, skill, system). Source of truth for history.',
    plain:'The complete game log. Every message ever exchanged between player and GM is stored here.',
    path:'data-dev/ai_gm.db · campaign_turns',
    notes:['user_text, assistant_text, route, turn_number','Read back by game_engine for context window','Also read by chapter_summary_service'],
    tag:['overview','all'] }),
  N('tf-campaigns-db','storage','campaigns','table (DB)',1200,176,220,50,'db',{
    role:'Campaign row: mode, gm_plan_json, model_id, character_id FK, session_flags JSON.',
    plain:'One row per campaign. Stores the GM story plan, which AI model to use, and all world flags.',
    path:'data-dev/ai_gm.db · campaigns',
    notes:['gm_plan_json: full story arc + beats','session_flags: location, combat roster, world state','model_id: per-campaign LLM override'],
    tag:['overview','all'] }),
  N('tf-game-events-db','storage','game_events','table (DB) · O1',1200,242,220,50,'db',{
    role:'Observability events table (O1). Written by event_logger.write_game_event; read by analytics panel (O3).',
    plain:'The game event log. Records things like "combat_victory", "player_death", "beat_complete" for the admin dashboard.',
    path:'data-dev/ai_gm.db · game_events',
    notes:['event_type, payload_json, created_at','Source for heat-map and analytics KPIs','OBSERVABILITY: Phase 11 primary table'],
    tag:['overview','observability','all'] }),
  N('tf-llm-log-db','storage','llm_call_log','table (DB) · O1',1200,308,220,50,'db',{

function edgePath(a,b){
  const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
  let sx=x1, ex=x2;
  if(b.x < a.x){ sx=a.x; ex=b.x+b.w; }
  const dx=Math.max(40,Math.abs(ex-sx)*0.5);
  const c1x = sx + (ex>=sx?dx:-dx), c2x = ex - (ex>=sx?dx:-dx);
  return {d:`M ${sx} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${ex} ${y2}`, mx:(sx+ex)/2, my:(y1+y2)/2};
}

function mdToHtml(md){
  let s=esc(md||'');
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre class="code">${c.replace(/\n$/,'')}</pre>`);
  s=s.replace(/^######\s?(.*)$/gm,'<h6>$1</h6>').replace(/^#####\s?(.*)$/gm,'<h5>$1</h5>')
     .replace(/^####\s?(.*)$/gm,'<h4>$1</h4>').replace(/^###\s?(.*)$/gm,'<h4>$1</h4>')
     .replace(/^##\s?(.*)$/gm,'<h3>$1</h3>').replace(/^#\s?(.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/^\s*[-*]\s+\[x\]\s?(.*)$/gim,'<div class="li done">☑ $1</div>')
     .replace(/^\s*[-*]\s+\[ \]\s?(.*)$/gim,'<div class="li">☐ $1</div>')
     .replace(/^\s*[-*]\s+(.*)$/gm,'<div class="li">• $1</div>')
     .replace(/^\s*\d+\.\s+(.*)$/gm,'<div class="li">$1</div>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\n{2,}/g,'<br><br>').replace(/(?<!>)\n(?!<)/g,'<br>');
  return s;
}
function fmtDate(iso){ return iso? iso.slice(0,10) : ''; }
async function fetchIssue(num){
  if(ISSUE_CACHE[num]) return ISSUE_CACHE[num];
  const base='https://api.github.com/repos/'+REPO+'/issues/'+num;
  const headers={'Accept':'application/vnd.github+json'};
  const iss=await fetch(base,{headers}).then(r=>{ if(!r.ok) throw new Error('issue '+r.status); return r.json(); });
  let comments=[];
  if(iss.comments>0){ comments=await fetch(base+'/comments?per_page=100',{headers}).then(r=>r.ok?r.json():[]).catch(()=>[]); }
  const data={iss,comments}; ISSUE_CACHE[num]=data; return data;
}

  document.getElementById('poplink').href='https://github.com/'+REPO+'/issues/'+num;
  const body=document.getElementById('popbody');

  const box=document.getElementById('popbox');
  document.getElementById('pop').classList.add('show');
  const w=box.offsetWidth, h=Math.min(box.offsetHeight, window.innerHeight*0.88);
  box.style.left=Math.max(8,(window.innerWidth-w)/2)+'px';
  box.style.top =Math.max(8,(window.innerHeight-h)/2)+'px';
  box.scrollTop=0;

    if(seq!==popSeq) return;

      `<span class="lbl">${fmtDate(iss.created_at)}</span><span class="lbl">${comments.length} komentarzy</span>${labels}`;

  }).catch(err=>{ if(seq!==popSeq) return; document.getElementById('popmeta').innerHTML=`<span class="lbl">${REPO}</span>`; body.innerHTML=`<div class="loading">Nie udało się pobrać (${esc(err.message)}). Otwórz na GitHub.</div>`; });
}
