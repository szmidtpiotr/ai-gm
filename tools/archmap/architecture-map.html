<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-GM · Mapa architektury — Combat (pilot)</title>
<style>
  :root{
    --bg:#0F0F0F; --panel:#161616; --panel-2:#1c1c1c; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#8a8a8a;
    --client:#4ea1ff; --route:#7bd389; --service:#c792ea; --db:#ffb86b;
    --external:#ff6b9d; --critical:#ff3860; --accent:#f5b942; --accent-2:#ff7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden}
  /* ---- top bar ---- */
  #topbar{position:absolute;top:10px;left:10px;right:auto;max-width:calc(100vw - 360px);z-index:5;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;background:rgba(20,20,20,.96);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #topbar h1{font-size:13px;margin:0 12px 0 0;font-weight:600;letter-spacing:.3px;white-space:nowrap;
    cursor:move;user-select:none}
  #topbar h1:active{cursor:grabbing}
  #topbar h1 .grip{color:var(--accent);margin-right:6px;font-size:14px}
  #topbar h1 span{color:var(--muted);font-weight:400}
  .chip{padding:4px 10px;border:1px solid var(--border);border-radius:14px;background:var(--panel-2);
    color:var(--muted);cursor:pointer;user-select:none;font-size:12px;transition:.12s}
  .chip:hover{color:var(--text);border-color:#3a3a3a}
  .chip.active{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
  .chip.crit.active{background:var(--critical);color:#fff;border-color:var(--critical)}
  .zoombtns{margin-left:auto;display:flex;gap:6px}
  .zoombtns button{width:28px;height:28px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);border-radius:6px;cursor:pointer;font-size:14px}
  .zoombtns button:hover{border-color:#3a3a3a}
  /* ---- canvas ---- */
  #canvas{flex:1;position:relative;overflow:hidden;cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  svg{position:absolute;top:0;left:0;width:100%;height:100%}
  #scene{transition:none}
  .cluster rect{fill-opacity:.10;stroke-opacity:.45;stroke-width:1}
  .cluster text{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;fill:var(--muted)}
  .node{cursor:pointer}
  .node rect{fill:var(--panel);stroke-width:1.4;rx:7;transition:opacity .12s}
  .node .lbl{font-size:12px;font-weight:600;fill:var(--text)}
  .node .sub{font-size:10.5px;fill:var(--muted)}
  .node.crit rect{stroke-width:2.4}
  .node.dead rect{stroke-dasharray:4 3;fill:#141014}
  .node.dimmed{opacity:.16}
  .edge{fill:none;stroke-width:1.4;opacity:.55}
  .edge.dimmed{opacity:.05}
  .edge.hot{stroke-width:2.6;opacity:.9}
  .elabel{font-size:9.5px;fill:var(--muted);opacity:.8}
  .elabel.dimmed{opacity:.04}
  .badge-fix{fill:var(--route)}
  .badge-bug{fill:var(--critical)}
  .badge text{font-size:9px;font-weight:700;fill:#0c0c0c}
  /* ---- sidebar ---- */
  #sidebar{width:340px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:16px 16px 40px;z-index:6}
  #sidebar h2{font-size:14px;margin:0 0 2px}
  #sidebar .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    color:var(--accent);word-break:break-all;margin-bottom:10px}
  #sidebar .role{font-size:12.5px;margin:8px 0}
  #sidebar .plain{font-size:12.5px;color:#cfcfcf;background:var(--panel-2);border-left:2px solid var(--service);
    padding:8px 10px;border-radius:4px;margin:8px 0}
  #sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
  #sidebar ul{margin:4px 0;padding-left:16px}
  #sidebar li{margin:3px 0;font-size:12px;color:#cfcfcf}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin:2px 4px 2px 0;
    border:1px solid var(--border);color:var(--muted)}
  .edgeline{font-size:11.5px;margin:3px 0;color:#cfcfcf}
  .edgeline b{color:var(--text);font-weight:600}
  .arrow{color:var(--muted)}
  .bug{font-size:11.5px;margin:4px 0;padding:5px 8px;border-radius:4px;background:#241317;border-left:2px solid var(--critical)}
  .bug .sev{font-weight:700;text-transform:uppercase;font-size:9px;color:var(--critical)}
  .fix{font-size:11.5px;margin:4px 0;padding:5px 8px;border-radius:4px;background:#142117;border-left:2px solid var(--route)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
  .legend i{width:18px;height:0;border-top:2px solid;display:inline-block}
  .muted{color:var(--muted)}
  .heatnote{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
  #overlaystate{font-size:10.5px;color:var(--muted);padding:2px 8px;border:1px dashed var(--border);border-radius:10px}
  .task{cursor:pointer;transition:.1s}
  .task:hover{filter:brightness(1.35)}
  /* ---- task popup ---- */
  #pop{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.6)}
  #pop.show{display:block}
  #popbox{position:fixed;left:0;top:0;width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:0 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  /* title bar — obvious, contrasting, draggable */
  #pophead{display:flex;align-items:flex-start;gap:10px;cursor:move;user-select:none;
    background:var(--panel-2);margin:0 -22px 12px;padding:12px 16px 12px 14px;
    border-radius:12px 12px 0 0;border-bottom:1px solid var(--accent)}
  #pophead:active{cursor:grabbing}
  #pophead .grip{color:var(--accent);font-size:18px;line-height:1.3;flex:0 0 auto}
  #pophead .htext{flex:1;min-width:0}
  #popclose{background:none;border:0;color:var(--muted);font-size:24px;line-height:.8;cursor:pointer;
    padding:0 2px;flex:0 0 auto}
  #popclose:hover{color:var(--text)}
  #popbox .num{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent);font-weight:700}
  #popbox .num::after{content:" · przeciągnij za ten pasek";color:var(--muted);font-weight:400;font-size:10.5px}
  #popbox h2#poptitle{font-size:16px;margin:4px 0 0;color:var(--text);font-weight:600;line-height:1.3}
  #popbox .meta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #popbox .meta .lbl{border:1px solid var(--border);border-radius:10px;padding:1px 7px}
  #popbody{overflow-y:auto;flex:1;border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px;
    font-size:12.5px;line-height:1.55;color:#d6d6d6}
  #popbody h3{font-size:13.5px;color:var(--accent);margin:14px 0 4px;border:0;text-transform:none;letter-spacing:0}
  #popbody h4{font-size:12.5px;color:#cfcfcf;margin:10px 0 3px}
  #popbody h5,#popbody h6{font-size:12px;color:var(--muted);margin:8px 0 2px}
  #popbody pre.code{background:#0c0c0c;border:1px solid var(--border);border-radius:6px;padding:8px 10px;
    overflow-x:auto;font-family:ui-monospace,monospace;font-size:11.5px;color:#cbd5b5;white-space:pre}
  #popbody code{background:#0c0c0c;border:1px solid var(--border);border-radius:4px;padding:0 4px;
    font-family:ui-monospace,monospace;font-size:11.5px;color:#e0c98a}
  #popbody .li{margin:2px 0 2px 6px}
  #popbody .li.done{color:var(--route)}
  #popbody a{color:var(--client)}
  #popbody .cmt{border-left:2px solid var(--service);background:var(--panel-2);padding:8px 12px;
    border-radius:4px;margin:10px 0}
  #popbody .cmt .who{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:5px}
  #popbody .loading{color:var(--muted);font-style:italic}
  #popbox .actions{display:flex;gap:10px;justify-content:flex-end}
  #popbox a.btn,#popbox button.btn{font-size:12.5px;padding:7px 14px;border-radius:7px;cursor:pointer;
    text-decoration:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text)}
  #popbox a.btn{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="canvas">
    <div id="topbar">
      <h1 title="Przeciągnij, by przesunąć panel filtrów"><span class="grip">⠿</span>AI-GM <span>· mapa architektury · Combat (pilot)</span></h1>
      <div id="chips"></div>
      <span id="overlaystate">overlay: —</span>
      <div class="zoombtns">
        <button id="zfit" title="Dopasuj">⤢</button>
        <button id="zin" title="Przybliż">+</button>
        <button id="zout" title="Oddal">−</button>
        <button onclick="resetLayout()" title="Przywróć domyślne pozycje paneli" style="width:auto;padding:0 8px;font-size:11px">↺ Reset układu</button>
      </div>
    </div>
    <svg id="svg">
      <defs>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L7,3 L0,6 Z" fill="#6a6a6a"></path>
        </marker>
        <marker id="arrcrit" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L7,3 L0,6 Z" fill="#ff3860"></path>
        </marker>
      </defs>
      <g id="scene">
        <g id="gClusters"></g>
        <g id="gEdges"></g>
        <g id="gLabels"></g>
        <g id="gNodes"></g>
      </g>
    </svg>
  </div>
  <div id="sidebar"></div>
</div>

<div id="pop" onclick="if(event.target===this)closeTask()">
  <div id="popbox">
    <div id="pophead">
      <span class="grip">⠿</span>
      <div class="htext">
        <div class="num" id="popnum"></div>
        <h2 id="poptitle"></h2>
      </div>
      <button id="popclose" onclick="closeTask()" title="Zamknij (Esc)">×</button>
    </div>
    <div class="meta" id="popmeta"></div>
    <div id="popbody"></div>
    <div class="actions">
      <button class="btn" onclick="closeTask()">Zamknij</button>
      <a class="btn" id="poplink" target="_blank" rel="noopener">Otwórz na GitHub ↗</a>
    </div>
  </div>
</div>

// edge geometry
function edgePath(a,b){
  const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
  // if b is left of a (back-edge), exit/enter on left/right sensibly
  let sx=x1, ex=x2;
  if(b.x < a.x){ sx=a.x; ex=b.x+b.w; }
  const dx=Math.max(40,Math.abs(ex-sx)*0.5);
  const c1x = sx + (ex>=sx?dx:-dx), c2x = ex - (ex>=sx?dx:-dx);
  return {d:`M ${sx} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${ex} ${y2}`, mx:(sx+ex)/2, my:(y1+y2)/2};
}

/* ---- task popup: click a task/bug row -> fetch the GitHub issue body + comments
   and render them inline. Public repo, so the browser reads the GitHub REST API
   directly (no token). Lazy + cached. Falls back to the GitHub link if offline or
   rate-limited (60 req/h per IP unauthenticated). ---- */
let REPO='szmidtpiotr/ai-gm';
const ISSUE_CACHE={};
const ISSUE_TTL=10*60*1000; // 10 min
let popSeq=0;

/* minimal markdown -> HTML, enough for issue bodies (headings, code, lists,
   checkboxes, bold/italic, inline code, links). Tables degrade to plain lines. */
function mdToHtml(md){
  let s=esc(md||'');
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre class="code">${c.replace(/\n$/,'')}</pre>`);
  s=s.replace(/^######\s?(.*)$/gm,'<h6>$1</h6>')
     .replace(/^#####\s?(.*)$/gm,'<h5>$1</h5>')
     .replace(/^####\s?(.*)$/gm,'<h4>$1</h4>')
     .replace(/^###\s?(.*)$/gm,'<h4>$1</h4>')
     .replace(/^##\s?(.*)$/gm,'<h3>$1</h3>')
     .replace(/^#\s?(.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/^\s*[-*]\s+\[x\]\s?(.*)$/gim,'<div class="li done">☑ $1</div>')
     .replace(/^\s*[-*]\s+\[ \]\s?(.*)$/gim,'<div class="li">☐ $1</div>')
     .replace(/^\s*[-*]\s+(.*)$/gm,'<div class="li">• $1</div>')
     .replace(/^\s*\d+\.\s+(.*)$/gm,'<div class="li">$1</div>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // collapse paragraphs; leave block tags alone
  s=s.replace(/\n{2,}/g,'<br><br>').replace(/(?<!>)\n(?!<)/g,'<br>');
  return s;
}

function fmtDate(iso){ return iso? iso.slice(0,10) : ''; }

async function fetchIssue(num){
  const cached=ISSUE_CACHE[num];
  if(cached && Date.now()-cached.ts<ISSUE_TTL) return cached.data;
  // Try baked data from overlay JSON first (works for private repos, no token needed).
  const baked=ISSUE_BAKED[String(num)];
  if(baked){
    const data={
      iss:{
        state:      baked.state||'open',
        user:       {login: baked.user_login||'?'},
        created_at: baked.created_at||'',
        labels:     (baked.labels||[]).map(n=>({name:n})),
        body:       baked.body||'_(brak opisu)_',
        comments:   baked.comment_count||0,
      },
      comments:[],  // full comment text not embedded; link to GitHub below
      _baked:true,
      _comment_count: baked.comment_count||0,
    };
    ISSUE_CACHE[num]={data,ts:Date.now()};
    return data;
  }
  // Fallback: GitHub REST API (works only for public repos or with a token).
  const base='https://api.github.com/repos/'+REPO+'/issues/'+num;
  const headers={'Accept':'application/vnd.github+json'};
  const iss=await fetch(base,{headers}).then(r=>{ if(!r.ok) throw new Error('issue '+r.status); return r.json(); });
  let comments=[];
  if(iss.comments>0){
    comments=await fetch(base+'/comments?per_page=100',{headers})
      .then(r=>r.ok?r.json():[]).catch(()=>[]);
  }
  const data={iss,comments};
  ISSUE_CACHE[num]={data,ts:Date.now()};
  return data;
}

function openTask(num,title,kind){
  const seq=++popSeq;
  document.getElementById('popnum').textContent=(kind==='task'?'Zadanie #':'Bug #')+num;
  document.getElementById('poptitle').textContent=title;
  document.getElementById('popmeta').innerHTML=`<span class="lbl">${REPO}</span><span class="lbl">ładowanie…</span>`;
  document.getElementById('poplink').href='https://github.com/'+REPO+'/issues/'+num;
  const body=document.getElementById('popbody');
  body.innerHTML='<div class="loading">Pobieram treść z GitHub…</div>';
  const box=document.getElementById('popbox');
  document.getElementById('pop').classList.add('show');
  // center on each open (box is always position:fixed; left/top in px)
  const w=box.offsetWidth, h=Math.min(box.offsetHeight, window.innerHeight*0.88);
  box.style.left=Math.max(8,(window.innerWidth-w)/2)+'px';
  box.style.top =Math.max(8,(window.innerHeight-h)/2)+'px';
  box.scrollTop=0;

  fetchIssue(num).then((data)=>{
    const {iss,comments}=data;
    if(seq!==popSeq) return; // a newer popup opened meanwhile
    const labels=(iss.labels||[]).map(l=>`<span class="lbl">${esc(l.name)}</span>`).join('');
    document.getElementById('popmeta').innerHTML=
      `<span class="lbl">${esc(iss.state)}</span><span class="lbl">@${esc(iss.user?.login||'?')}</span>`+
      `<span class="lbl">${fmtDate(iss.created_at)}</span><span class="lbl">${comments.length} komentarzy</span>${labels}`;
    let html=mdToHtml(iss.body||'_(brak opisu)_');
    if(comments.length){
      html+='<h3>Komentarze ('+comments.length+')</h3>';
      comments.forEach(c=>{
        html+=`<div class="cmt"><div class="who">@${esc(c.user?.login||'?')} · ${fmtDate(c.created_at)}</div>${mdToHtml(c.body||'')}</div>`;
      });
    } else if(data._baked && data._comment_count>0){
      html+=`<p style="color:var(--muted);font-size:0.82rem;margin-top:12px">💬 ${data._comment_count} komentarz(y) — otwórz na GitHub (przycisk poniżej) żeby zobaczyć.</p>`;
    }
    body.innerHTML=html;
    body.scrollTop=0;
  }).catch(err=>{
    if(seq!==popSeq) return;
    document.getElementById('popmeta').innerHTML=`<span class="lbl">${REPO}</span>`;
    body.innerHTML=`<div class="loading">Nie udało się pobrać treści (${esc(err.message)}).`+
      ` Otwórz na GitHub przyciskiem poniżej. (Limit API to 60 zapytań/h na IP bez logowania.)</div>`;
  });
}
function closeTask(){ document.getElementById('pop').classList.remove('show'); popSeq++; }
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeTask(); });

/* ---- drag the popup by its header bar (#pophead) ---- */
(function(){
  const box=document.getElementById('popbox');
  const head=document.getElementById('pophead');
  let drag=null;
  head.addEventListener('mousedown',e=>{
    if(e.target.id==='popclose') return; // close button stays clickable
    const r=box.getBoundingClientRect();
    drag={dx:e.clientX-r.left, dy:e.clientY-r.top};
    document.body.style.userSelect='none';
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove',e=>{
    if(!drag) return;
    box.style.left=Math.max(4,Math.min(window.innerWidth -60, e.clientX-drag.dx))+'px';
    box.style.top =Math.max(4,Math.min(window.innerHeight-40, e.clientY-drag.dy))+'px';
  });
  document.addEventListener('mouseup',()=>{ if(drag){drag=null; document.body.style.userSelect='';} });
})();

/* ---- drag the filter toolbar (#topbar) by its title; remember position ---- */
(function(){
  const bar=document.getElementById('topbar');
  const handle=bar.querySelector('h1');
  const LS_KEY='archmap_topbar_pos';
  let d=null;
  try{const p=JSON.parse(localStorage.getItem(LS_KEY));
    if(p){bar.style.left=p.left+'px'; bar.style.top=p.top+'px'; bar.style.right='auto';}}catch(e){}
  handle.addEventListener('mousedown',e=>{
    const r=bar.getBoundingClientRect();
    d={dx:e.clientX-r.left, dy:e.clientY-r.top};
    bar.style.right='auto';
    document.body.style.userSelect='none';
    e.preventDefault(); e.stopPropagation();   // don't pan the map underneath
  });
  document.addEventListener('mousemove',e=>{
    if(!d) return;
    bar.style.left=Math.max(4,Math.min(window.innerWidth -120, e.clientX-d.dx))+'px';
    bar.style.top =Math.max(4,Math.min(window.innerHeight-40,  e.clientY-d.dy))+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!d) return;
    const r=bar.getBoundingClientRect();
    try{localStorage.setItem(LS_KEY,JSON.stringify({left:Math.round(r.left),top:Math.round(r.top)}));}catch(e){}
    d=null; document.body.style.userSelect='';
  });
  window.resetLayout=function(){ try{localStorage.removeItem(LS_KEY);}catch(e){} bar.style.left='10px'; bar.style.top='10px'; bar.style.right='auto'; };
})();

document.getElementById('canvas').addEventListener('click',()=>{pinned=null;clearDim();document.getElementById('sidebar').innerHTML=defaultSidebar();});

/* ---- filter chips ---- */
const CHIPS=[
  ['overview','Overview'],['critical-path','Ścieżka krytyczna',true],['attack','Atak'],
  ['conditions','Kondycje'],['zones','Strefy'],['loot-xp','Loot/XP'],['death','Śmierć'],
  ['observability','Observability'],['dead-code','Martwy kod'],['heat','Heat-map (live)'],['all','Wszystkie kable'],
];
const chipsBox=document.getElementById('chips');
CHIPS.forEach(([id,label,crit])=>{
  const c=document.createElement('div');c.className='chip'+(crit?' crit':'')+(id==='overview'?' active':'');
  c.textContent=label;c.dataset.id=id;
  c.addEventListener('click',()=>applyChip(id));
  chipsBox.appendChild(c);
});
function applyChip(id){
  activeChip=id;
  [...chipsBox.children].forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  const showAll = id==='all';
  nodes.forEach(n=>{
    const on = showAll || id==='heat' || (n.tag||[]).includes(id);
    nodeEls[n.id].g.style.display = on?'':'none';
  });
  edgeEls.forEach(({e,p,lbl})=>{
    const on = showAll || (id==='heat'? true : (e.tag||[]).includes(id));
    p.style.display=on?'':'none'; lbl.style.display=(on && id!=='heat')?'':'none';
  });
  renderHeat();
  pinned=null;clearDim();document.getElementById('sidebar').innerHTML=defaultSidebar();
  const oi=document.getElementById('ovinfo'); if(oi) oi.textContent = id==='heat'? heatMsg() : '';
}

/* ============================ PAN / ZOOM ============================ */
let tx=0,ty=0,s=1;
function apply(){scene.setAttribute('transform',`translate(${tx},${ty}) scale(${s})`);}
const cv=document.getElementById('canvas');
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const ds=Math.exp(-e.deltaY*0.0014); const ns=Math.min(2.5,Math.max(0.25,s*ds));
  tx = mx - (mx-tx)*(ns/s); ty = my - (my-ty)*(ns/s); s=ns; apply();
},{passive:false});
let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX-tx,y:e.clientY-ty};cv.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(drag){tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply();}});
window.addEventListener('mouseup',()=>{drag=null;cv.classList.remove('grabbing');});
function fit(){
  const pad=40, W=cv.clientWidth-340, H=cv.clientHeight;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  clusters.forEach(c=>{minX=Math.min(minX,c.x);minY=Math.min(minY,c.y);maxX=Math.max(maxX,c.x+c.w);maxY=Math.max(maxY,c.y+c.h);});
  const bw=maxX-minX, bh=maxY-minY;
  s=Math.min((W-pad*2)/bw,(H-pad*2)/bh,1.4);
  tx=pad-minX*s + Math.max(0,(W-bw*s)/2-pad);
  ty=pad-minY*s; apply();
}
document.getElementById('zfit').onclick=fit;
document.getElementById('zin').onclick=()=>{s=Math.min(2.5,s*1.15);apply();};
document.getElementById('zout').onclick=()=>{s=Math.max(0.25,s/1.15);apply();};

/* ============================ OVERLAY LOAD ============================ */
function heatMsg(){
  const ids=Object.keys(HEAT); if(!ids.length) return 'Heat-map pusta — Phase 11 (game_events/llm_call_log) jeszcze nie zapisała danych. Odpal overlay/update_overlay.sh gdy tabele istnieją.';
  const tot=ids.reduce((a,k)=>a+(HEAT[k].calls||0),0);
  return `Heat-map: ${ids.length} węzłów z danymi, ${tot} wywołań w oknie.`;
}
function setOverlayState(t){const e=document.getElementById('overlaystate'); if(e) e.textContent='overlay: '+t;}
fetch('overlay/map-overlay.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(o=>{
    FIXES=o.fixes||{}; KNOWN_BUGS=o.bugs||{}; HEAT=o.heat||{}; ISSUE_BAKED=o.issues||{}; if(o.repo) REPO=o.repo;
    const nb=Object.values(KNOWN_BUGS).reduce((a,x)=>a+x.length,0);
    const nf=Object.values(FIXES).reduce((a,x)=>a+x.length,0);
    setOverlayState(`${nb} bugów · ${nf} fixów · ${Object.keys(HEAT).length} heat${o.generated_at?` · ${o.generated_at}`:''}`);
    renderBadges(); renderHeat();
  })
  .catch(()=>{ setOverlayState('brak (statyczna mapa)'); renderBadges(); });

/* boot */
document.getElementById('sidebar').innerHTML=defaultSidebar();
fit();
</script>
