server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ai-gm-dev-docker
    # Query tip (Loki): always start with at least one label pair, e.g.
    # {job="ai-gm-dev", container="/ai-gm-dev-backend-1"} |= "request_complete"
    # or {job="ai-gm-dev", service="backend-dev"} |= "/api/turns"
    # Queries like |= "text" without {...} return HTTP 400 ("at least one label pair required").
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_service"]
        regex: "(backend-dev|frontend-dev|test-agent-dev)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_label_service"]
        target_label: service
        replacement: "test-agent"
        regex: "test-agent-dev"
      - replacement: ai-gm-dev
        target_label: job
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - docker: {}
